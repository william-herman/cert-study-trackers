# PMP study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: pmp
code: PMP
name: Project Management Professional
issuer: PMI
category: project-management
kind: exam
confidence: source-traced
blueprint:
  title: PMP Examination Content Outline
  version: '2026'
  published: July 2026 exam update
last_checked: '2026-10-02'
summary: >-
  Study plan for the new (July 2026) PMP exam: eligibility and the 35-hour training rule, all 26 tasks across
  People, Process and Business Environment, PMI's reference list, and the exam-day and renewal rules.
snapshot:
  title: Exam snapshot
  items:
  - '**180 questions in 240 minutes**: 170 scored, 10 unscored pretest'
  - Two 10-minute breaks. You **can't go back** to a section once you take a break
  - '**New question types:** case/scenario sets and graphic-based questions, plus multiple choice, multiple response, matching and more'
  - About **40% predictive** and **60% agile or hybrid**, spread across all three domains
  - At a Pearson VUE test center (PMI's recommendation) or online with a proctor
  - Up to 3 attempts within a 1-year eligibility window
  - Fee depends on PMI membership and region; check at checkout
  - Renew every 3 years with 60 PDUs and a renewal fee
lens:
  title: The lens for every question
  intro: 'From the reasoning in PMI''s published sample questions and the outline:'
  body:
  - Assess before you act. Evaluate the impact and the options first, then follow the agreed process (for example, change control), rather than rejecting, accepting or escalating on reflex.
  - Deal with people directly. When a stakeholder causes confusion, talk to them about roles, authority and impact instead of quietly working around it or passing it on.
  - Think in outcomes and value, not just schedule and budget. The 2026 outline puts value delivery, AI and sustainability into project scenarios, and Business Environment rose from 8% to 26%.
  - Most questions aren't predictive. Expect to choose the right approach, predictive, agile or hybrid, for the situation described.
  prompts:
  - What should I do first, before taking any irreversible step?
  - Is there an agreed process here that I should follow?
  - Which option delivers the most value to stakeholders, not just the plan?
domains:
- {id: 1, name: People, short: People, weight: 33}
- {id: 2, name: Process, short: Process, weight: 41}
- {id: 3, name: Business Environment, short: Business Environment, weight: 26}
tag_legend:
- tag: added
  style: added
  meaning: apply-it-to-your-own-projects exercises beyond the outline
- tag: optional
  style: optional
  meaning: not counted toward progress
sections:
- id: s0
  'no': '0'
  title: Eligibility and application
  short: Eligibility
  note: You have to qualify before you can sit the exam. Do this first.
  groups:
  - title: Check you qualify
    items:
    - id: e-exp
      text: Confirm your experience path. All experience must be non-overlapping, leading projects in a professional setting, within the last 10 years.
      sub:
      - 'Secondary school: 5 years (60 months).'
      - 'Associate''s-level or advanced vocational: 4 years (48 months).'
      - 'Bachelor''s or higher: 3 years (36 months).'
      - 'Bachelor''s or postgraduate from a PMI GAC-accredited program: 2 years (24 months).'
    - id: e-overlap
      text: Count months, not projects. Two projects that overlapped in the same months only count once.
    - id: e-35
      text: Complete 35 hours of project management training aligned to the outline (an active CAPM waives this).
      sub:
      - 'From 1 December 2026, **live** classes only count if run by a PMI Authorized Training Partner, a China REP, or an accredited academic program.'
      - Self-paced courses from any provider still count, and training finished before 1 December 2026 stays eligible.
      - Books and practice exams alone don't count.
  - title: Apply
    items:
    - id: e-record
      text: Record each project separately, describing your role leading and directing it. Leave out routine, operational or admin work.
    - id: e-audit
      text: Keep proof of your education level, experience and training hours ready. Any application can be selected for audit.
    - id: e-window
      text: Once approved, pay the fee and schedule. You have **1 year** of eligibility to pass.
- id: s1
  'no': '1'
  title: Official resources
  note: PMI says the exam isn't written from any single text; these are the sources it cites most.
  groups:
  - items:
    - id: r-eco
      text: >-
        Read the [PMP Examination Content Outline (July 2026)](https://www.pmi.org/-/media/pmi/documents/public/pdf/certifications/new-pmp-examination-content-outline-2026.pdf?rev=af7ae1c6006f43009fee4f613a350f9b)
        end to end. It defines every task tested and is the coverage list below.
    - id: r-pmbok
      text: The [PMBOK® Guide](https://www.pmi.org/standards/pmbok), free for PMI members.
    - id: r-agile
      text: The [Agile Practice Guide](https://www.pmi.org/standards/agile), free for PMI members. Most questions involve agile or hybrid work.
    - id: r-handbook
      text: Read the [PMI Certification Handbook](https://www.pmi.org/-/media/pmi/documents/public/pdf/certifications/generic-certification-handbook.pdf?rev=50817fae4cd644b2b29df06898e27a33) for application, audit, scheduling and exam-day rules.
    - id: r-prep
      tag: optional
      text: PMI's on-demand [PMP Exam Prep Course](https://www.pmi.org/dcpdp/sku/EL326), which also meets the 35-hour requirement.
    - id: r-refs
      tag: optional
      text: >-
        Additional references PMI lists, for example *Essential Scrum* (Rubin), *Project Management: The Managerial
        Process* (Larson) and Kerzner's *Project Management: A Systems Approach*. PMI doesn't endorse these.
- id: s2
  'no': '2'
  title: People
  domain: 1
  note: 8 tasks, 33% of the exam.
  groups:
  - title: Tasks to own
    items:
    - {id: d1-1, ts: '1.1', text: 'Develop a common vision', sub: [Build and promote a shared vision with key stakeholders, and keep it current., Find the root cause when people misunderstand it.]}
    - {id: d1-2, ts: '1.2', text: 'Manage conflicts', sub: [Identify sources and analyze context; implement an agreed resolution strategy., Set and uphold ground rules, and handle violations.]}
    - {id: d1-3, ts: '1.3', text: 'Lead the project team', sub: [Set team expectations; empower the team; solve problems; represent the team's voice., Support varied experience and perspectives; choose a leadership style; set clear roles.]}
    - {id: d1-4, ts: '1.4', text: 'Engage stakeholders', sub: ['Identify and analyze stakeholders, and tailor communication to them.', Execute the engagement plan; align needs with objectives; build trust and influence.]}
    - {id: d1-5, ts: '1.5', text: 'Align stakeholder expectations', sub: [Categorize stakeholders and identify their expectations., Facilitate discussions to align them; act on mentoring opportunities.]}
    - {id: d1-6, ts: '1.6', text: 'Manage stakeholder expectations', sub: ['Identify internal and external customer expectations, align outcomes to them, and monitor satisfaction.']}
    - {id: d1-7, ts: '1.7', text: 'Help ensure knowledge transfer', sub: ['Identify and gather critical knowledge, and foster an environment for sharing it.']}
    - {id: d1-8, ts: '1.8', text: 'Plan and manage communication', sub: [Define a communication strategy; promote transparency; set up a feedback loop., Understand reporting requirements and create reports that fit sponsors and governance.]}
  - title: Apply
    items:
    - id: a1-conflict
      tag: added
      text: Think of a real conflict on a past project. Name its source, the resolution strategy used, and what you'd do differently now.
- id: s3
  'no': '3'
  title: Process
  domain: 2
  note: 10 tasks, 41% of the exam, the heaviest domain.
  groups:
  - title: Tasks to own
    items:
    - {id: d2-1, ts: '2.1', text: 'Develop an integrated project management plan and plan delivery', sub: ['Assess needs, complexity and size, and recommend a predictive, agile or hybrid approach.', 'Determine critical information needs (for example, sustainability) and an execution strategy.', 'Create, assess and maintain the integrated plan; estimate effort and resources; use data to decide.']}
    - {id: d2-2, ts: '2.2', text: 'Develop and manage project scope', sub: [Define scope; get stakeholder agreement; break it down.]}
    - {id: d2-3, ts: '2.3', text: 'Help ensure value-based delivery', sub: [Identify value with stakeholders and prioritize work by value and feedback., Look for incremental delivery; track business value and benefits throughout.]}
    - {id: d2-4, ts: '2.4', text: 'Plan and manage resources', sub: ['Plan resources from requirements, then manage and optimize availability.']}
    - {id: d2-5, ts: '2.5', text: 'Plan and manage procurement', sub: ['Plan procurement and strategy; choose contract types; negotiate.', 'Manage suppliers and contracts, evaluate vendor performance, and confirm agreement objectives are met.']}
    - {id: d2-6, ts: '2.6', text: 'Plan and manage finance', sub: ['Analyze financial needs; quantify risk and contingency allocations.', Plan spend tracking and financial reporting; monitor variations; manage reserves.]}
    - {id: d2-7, ts: '2.7', text: 'Plan and optimize quality of products and deliverables', sub: ['Gather quality requirements; plan and run quality processes and reviews.', 'Ensure regulatory compliance; manage cost of quality and sustainability; improve continuously.']}
    - {id: d2-8, ts: '2.8', text: 'Plan and manage schedule', sub: ['Prepare a schedule suited to the approach; estimate with milestones, dependencies or story points.', 'Use benchmarks and history; baseline, execute and analyze variation; coordinate with other work.']}
    - {id: d2-9, ts: '2.9', text: 'Evaluate project status', sub: [Develop and update metrics; assess progress; communicate status., 'Identify, tailor and maintain the right artifacts, and keep them accessible.']}
    - {id: d2-10, ts: '2.10', text: 'Manage project closure', sub: ['Get approval of completion; set closure criteria; validate readiness for transition.', 'Close out lessons learned, retrospectives, procurement, financials and resources.']}
  - title: Apply
    items:
    - id: a2-approach
      tag: added
      text: For three projects you know, say whether predictive, agile or hybrid fits best, and the one fact that decides it.
    - id: a2-value
      tag: added
      text: Pick one project and write how you'd know it delivered value, beyond being on time and on budget.
- id: s4
  'no': '4'
  title: Business Environment
  short: Business Environment
  domain: 3
  note: 8 tasks, 26% of the exam, up from 8% in the previous outline.
  groups:
  - title: Tasks to own
    items:
    - {id: d3-1, ts: '3.1', text: 'Define and establish project governance', sub: ['Set structure, rules, reporting, ethics and policies using organizational process assets.', Define success metrics and escalation paths and thresholds.]}
    - {id: d3-2, ts: '3.2', text: 'Plan and manage project compliance', sub: ['Confirm requirements (security, health and safety, sustainability, regulatory) and classify them.', 'Find threats, analyze the cost of noncompliance, act, and measure compliance.']}
    - {id: d3-3, ts: '3.3', text: 'Manage and control changes', sub: [Run the change control process and communicate change status., Implement approved changes and update documentation.]}
    - {id: d3-4, ts: '3.4', text: 'Remove impediments and manage issues', sub: ['Evaluate, prioritize and remove impediments, and keep reassessing.', Recognize when a risk becomes an issue; resolve issues with the right stakeholders.]}
    - {id: d3-5, ts: '3.5', text: 'Plan and manage risk', sub: ['Identify, analyze, monitor and control risks; keep a risk register.', 'Plan and execute responses, including security and sustainability risks, and report risk status.']}
    - {id: d3-6, ts: '3.6', text: 'Continuous improvement', sub: [Use lessons learned; keep improvement processes and organizational process assets updated.]}
    - {id: d3-7, ts: '3.7', text: 'Support organizational change', sub: ['Assess culture, and evaluate how organizational change affects the project.']}
    - {id: d3-8, ts: '3.8', text: 'Evaluate external business environment changes', sub: ['Watch regulation, technology, geopolitical and market changes, and adjust scope or backlog for them.']}
  - title: Apply
    items:
    - id: a3-ext
      tag: added
      text: Name one external change (a regulation, an AI tool, a market shift) that affected a project you know, and how scope or backlog should have responded.
- id: s5
  'no': '5'
  title: Readiness
  short: Readiness
  groups:
  - items:
    - id: x-samples
      text: Work through the sample questions on PMI's [PMP certification page](https://www.pmi.org/certifications/project-management-pmp). For each, explain why the other options are worse.
    - id: x-practice
      tag: optional
      text: PMI's official full-length PMP Practice Exam, or PMI Study Hall, linked from the [new exam page](https://www.pmi.org/certifications/project-management-pmp/new-exam).
    - id: x-types
      text: Get comfortable with case/scenario sets and graphic-based questions, which are new in 2026. Practice reading a chart or scenario before the questions.
    - id: x-teach
      text: Explain each of the 26 tasks in a sentence or two, with an example from your own projects, without notes.
    - id: x-gate
      text: '**Booking gate:** every task ticked, and your practice results are consistent.'
- id: s6
  'no': '6'
  title: Exam day
  short: Exam day
  groups:
  - items:
    - id: l-sched
      text: Schedule through PMI with Pearson VUE, at a test center (PMI recommends this) or online.
    - id: l-online
      text: If testing online, run Pearson's system test in advance, use a private space, and have valid photo ID. You may be asked for ID again after a break.
    - id: l-breaks
      text: 'Plan your breaks: the first comes after the case-study section, the second about halfway through the rest. Review your answers first, because you can''t return afterward.'
    - id: l-pace
      text: Pace at about 1 minute 20 seconds per question.
    - id: l-retake
      text: If you don't pass, you can retake up to 3 times within your 1-year eligibility. After 3 attempts there's a 1-year wait.
- id: s7
  'no': '7'
  title: After passing
  short: Renewal
  groups:
  - items:
    - id: m-ccr
      text: >-
        Plan renewal: 60 PDUs every 3 years plus the renewal fee. One PDU is one hour of learning, teaching, presenting,
        reading, volunteering or creating content. See PMI's [maintenance page](https://www.pmi.org/certifications/certification-resources/maintain).
