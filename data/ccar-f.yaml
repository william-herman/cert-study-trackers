# CCAR-F study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: ccar-f
code: CCAR-F
name: Claude Certified Architect – Foundations
issuer: Anthropic
kind: exam
confidence: source-traced
blueprint:
  title: CCAR-F Exam Guide
  version: '1.0'
  published: 2026-07
last_checked: '2026-10-01'
summary: >-
  Hands-on study plan for the CCAR-F exam: the five weighted domains, every official exercise, extra builds
  for thinly covered task statements, and readiness gates.
snapshot:
  title: Exam snapshot
  items:
  - 60 items in 120 min (about 135 min seat time)
  - Multiple-choice and **multiple-response**; each item says how many to pick
  - 4 scenarios drawn from a bank of 6
  - Scaled 100–1,000, **720 to pass**, with percent-correct by domain
  - $125, proctored by Pearson VUE, closed book
  - Valid 12 months; renewal is a free online assessment
lens:
  title: The lens for every question
  body: >-
    Each item asks for the root cause and the proportionate fix. Wrong answers over-engineer (classifiers,
    routing layers, bigger models, voting) or use a prompt where a guarantee is needed.
  prompts:
  - What's the smallest change that fixes the actual failure?
  - Does this need a guarantee (code) or guidance (prompt)?
domains:
- id: 1
  name: Agentic Architecture & Orchestration
  short: Agentic Architecture & Orchestration
  weight: 27
- id: 2
  name: Tool Design & MCP Integration
  short: Tool Design & MCP
  weight: 18
- id: 3
  name: Claude Code Configuration & Workflows
  short: Claude Code Config & Workflows
  weight: 20
- id: 4
  name: Prompt Engineering & Structured Output
  short: Prompt Eng. & Structured Output
  weight: 20
- id: 5
  name: Context Management & Reliability
  short: Context Mgmt & Reliability
  weight: 15
tag_legend:
- tag: Ex1–Ex4
  style: ex
  meaning: official exercise steps
- tag: added
  style: added
  meaning: extra builds covering task statements the exercises touch lightly
- tag: optional
  style: optional
  meaning: not counted toward progress
sections:
- id: s0
  'no': '0'
  title: Eligibility & setup
  note: Do this first.
  groups:
  - items:
    - id: e-guide
      text: >-
        Read the full [Exam Guide v1.0 (PDF)](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf)
        cover to cover. The March 2026 version circulating online is superseded.
    - id: e-env
      text: Environment ready
      sub:
      - Python or TypeScript
      - Claude API key
      - Claude Code installed
      - Claude Agent SDK installed
      - Pydantic or a JSON Schema validator
    - id: e-github
      text: >-
        Take GitHub's free [Introduction to GitHub](https://github.com/skills/introduction-to-github)
        course (under an hour). It covers repositories, branches, commits and pull requests, which is
        what you need to set up and work in the study repo.
    - id: e-repo
      text: Create the study repo (e.g. `ccarf-lab/`) that every build goes into.
- id: s1
  'no': '1'
  title: Free Anthropic courses
  note: Take each one just before the build section it supports, not all up front.
  groups:
  - title: Core
    items:
    - id: c-api
      text: >-
        [Building with the Claude API](https://anthropic.skilljar.com/claude-with-the-anthropic-api):
        tool use, tool_choice, structured output, agentic loops, batches. *Before §2 and §5.*
    - id: c-mcp
      text: >-
        [Introduction to Model Context Protocol](https://anthropic.skilljar.com/introduction-to-model-context-protocol):
        tools vs. resources vs. prompts. *Before §3.*
    - id: c-cc
      text: >-
        [Claude Code in Action](https://anthropic.skilljar.com/claude-code-in-action): configuration,
        hooks, automation, headless/CI. *Before §4.*
    - id: c-skills
      text: >-
        [Introduction to Agent Skills](https://anthropic.skilljar.com/introduction-to-agent-skills): SKILL.md
        and frontmatter (3.2). *Before §4.*
    - id: c-sub
      text: >-
        [Introduction to Subagents](https://anthropic.skilljar.com/introduction-to-subagents): context
        isolation and delegation (1.3, 3.4, 5.4). *Before §2 and §4.*
  - title: Optional, only if a gap shows up
    items:
    - id: c-p101
      text: >-
        [Claude Platform 101](https://anthropic.skilljar.com/claude-platform-101): API fundamentals refresher.
      tag: optional
    - id: c-cc101
      text: >-
        [Claude Code 101](https://anthropic.skilljar.com/claude-code-101): daily Claude Code workflow
        refresher.
      tag: optional
  skip:
  - >-
    Claude with Amazon Bedrock / Claude on Google Cloud: on the official prep list, but cloud-provider
    configuration is out of scope.
  - >-
    Model Context Protocol: Advanced Topics: sampling, notifications and transports are mostly server
    hosting, which is out of scope.
  - 'Claude 101 / AI Fluency: on the official list but well below this exam''s level for anyone ready to sit it.'
- id: s2
  'no': '2'
  title: Agentic Architecture & Orchestration
  domain: 1
  note: The highest-weighted domain.
  groups:
  - title: Concepts to own
    items:
    - id: d1-1
      text: Agentic loop
      ts: '1.1'
      sub:
      - 'Continue on `stop_reason: "tool_use"`, stop on `"end_turn"`; append tool results to history.'
      - >-
        Anti-patterns: parsing text to decide when to stop, iteration caps as the primary stop, assistant
        text as the completion signal.
      - Model-driven tool choice vs. pre-scripted decision trees.
    - id: d1-2
      text: Hub-and-spoke orchestration
      ts: '1.2'
      sub:
      - Coordinator routes *all* inter-agent communication.
      - Select subagents dynamically instead of always running the full pipeline.
      - Partition scope to avoid duplicate work; watch for overly narrow decomposition.
      - >-
        **Iterative refinement:** evaluate synthesis for gaps → re-delegate targeted queries → re-synthesize.
    - id: d1-3
      text: Subagent spawning and context passing
      ts: '1.3'
      sub:
      - '`Task` tool, with `"Task"` required in `allowedTools`.'
      - '`AgentDefinition`: description, system prompt, tool restrictions.'
      - Subagents inherit *nothing*; pass findings explicitly in the prompt.
      - Parallel = multiple `Task` calls in **one** response.
      - Coordinator prompts give goals and quality criteria, not step-by-step procedures.
    - id: d1-4
      text: Programmatic enforcement vs. prompt guidance
      ts: '1.4'
      sub:
      - Prompts have a non-zero failure rate.
      - Prerequisite gates, e.g. block `process_refund` until `get_customer` returns a verified ID.
      - >-
        Structured handoffs for humans who can't see the transcript: customer ID, root cause, amount,
        recommended action.
    - id: d1-5
      text: Hooks
      ts: '1.5'
      sub:
      - '`PostToolUse` to normalize data (Unix timestamps, ISO 8601, status codes).'
      - Tool-call interception to block policy violations (e.g. refund > $500) and redirect to escalation.
    - id: d1-6
      text: >-
        Decomposition: prompt chaining for predictable multi-aspect work vs. dynamic decomposition for
        open-ended investigation (map → prioritize → adapt).
      ts: '1.6'
    - id: d1-7
      text: Sessions
      ts: '1.7'
      sub:
      - '`--resume <name>` and `fork_session`.'
      - Tell a resumed session which files changed.
      - Prefer a fresh session plus an injected summary when prior tool results are stale.
  - title: 'Build · Exercise 1: multi-tool agent with escalation'
    items:
    - id: b1-tools
      text: >-
        Define 3–4 tools with detailed descriptions, including **two deliberately similar tools** that
        need careful wording to keep apart.
      tag: Ex1
    - id: b1-loop
      text: Implement the agentic loop handling both `tool_use` and `end_turn` correctly.
      tag: Ex1
    - id: b1-err
      text: >-
        Add structured errors (`errorCategory`, `isRetryable`, readable message). Confirm transient errors
        are retried and business errors explained to the user.
      tag: Ex1
    - id: b1-hook
      text: Add a hook that intercepts tool calls to enforce a threshold rule and redirects to escalation.
      tag: Ex1
    - id: b1-multi
      text: >-
        Test multi-concern messages: the agent decomposes them, handles each concern, and synthesizes
        one response.
      tag: Ex1
    - id: b1-norm
      text: Add a `PostToolUse` hook that normalizes mixed date and status formats from two tools.
      tag: added
    - id: b1-match
      text: >-
        Have a tool return **multiple customer matches**; confirm the agent asks for another identifier
        instead of guessing (5.2).
      tag: added
    - id: b1-handoff
      text: On escalation, emit a structured handoff summary object.
      tag: added
  - title: 'Build · Exercise 4, part 1: multi-agent research pipeline'
    items:
    - id: b4-coord
      text: >-
        Coordinator with ≥2 subagents (web search, doc analysis). `allowedTools` includes `"Task"`; findings
        passed explicitly in subagent prompts.
      tag: Ex4
    - id: b4-par
      text: Parallel execution via multiple `Task` calls in one response. Measure latency vs. sequential.
      tag: Ex4
    - id: b4-gap
      text: >-
        Give the coordinator a gap-check step that re-delegates targeted queries before final synthesis
        (1.2).
      tag: added
    - id: b4-sess
      text: >-
        Run a named session, change a file, resume while saying what changed, then `fork_session` to compare
        two approaches (1.7).
      tag: added
  - title: Self-check
    items:
    - id: d1-sc1
      text: Explain out loud why a prompt can't *guarantee* verify-before-refund, and what does.
    - id: d1-sc2
      text: >-
        Explain why “the report only covers visual arts” is a coordinator decomposition problem, not a
        search problem.
- id: s3
  'no': '3'
  title: Tool Design & MCP Integration
  domain: 2
  groups:
  - title: Concepts to own
    items:
    - id: d2-1
      text: Tool descriptions are the *primary* selection mechanism
      ts: '2.1'
      sub:
      - Include input formats, example queries, edge cases, when to use vs. alternatives.
      - Rename or split overlapping tools.
      - Watch for system-prompt keywords that override good descriptions.
    - id: d2-2
      text: MCP `isError` and error categories (transient / validation / business / permission)
      ts: '2.2'
      sub:
      - Generic “Operation failed” blocks recovery.
      - 'Business errors carry `isRetryable: false` plus customer-friendly text.'
      - '**Access failure ≠ valid empty result.**'
    - id: d2-3
      text: Tool distribution and `tool_choice`
      ts: '2.3'
      sub:
      - 4–5 scoped tools per agent, not 18.
      - Cross-role tools only for high-frequency needs (e.g. `verify_fact`).
      - Constrained tools beat generic ones (`load_document` vs. `fetch_url`).
      - '`"auto"` / `"any"` / forced `{"type":"tool","name":…}`.'
    - id: d2-4
      text: MCP configuration
      ts: '2.4'
      sub:
      - '`.mcp.json` = project, shared; `~/.claude.json` = user, personal.'
      - '`${ENV_VAR}` expansion for secrets.'
      - All servers' tools are discovered at connection time.
      - >-
        **Prefer community servers for standard integrations (e.g. Jira);** custom only for team-specific
        workflows.
      - '**Resources** = content catalogs; **tools** = actions.'
    - id: d2-5
      text: Built-in tools
      ts: '2.5'
      sub:
      - Grep = content search; Glob = path patterns.
      - Edit needs a unique anchor; fall back to Read + Write.
      - Explore incrementally (Grep entry points → Read imports), not everything up front.
  - title: Build
    items:
    - id: b2-desc
      text: >-
        With the Ex1 similar-tool pair: keep descriptions minimal, log misroutes, then fix by **rewriting
        descriptions only**. No routing layer.
      tag: added
    - id: b2-split
      text: >-
        Split a generic tool into purpose-specific ones (`analyze_document` → `extract_data_points` /
        `summarize_content` / `verify_claim_against_source`).
      tag: added
    - id: b2-res
      text: Expose a small content catalog as an **MCP resource**; observe fewer exploratory tool calls.
      tag: added
    - id: b2-grep
      text: Write an MCP tool description strong enough that Claude prefers it over built-in Grep for
        its task.
      tag: added
    - id: b2-trace
      text: >-
        In Claude Code on a real repo: trace a function's callers through wrapper modules (Grep → Read),
        force an Edit non-unique failure, recover with Read + Write.
      tag: added
- id: s4
  'no': '4'
  title: Claude Code Configuration & Workflows
  domain: 3
  groups:
  - title: Concepts to own
    items:
    - id: d3-1
      text: CLAUDE.md hierarchy
      ts: '3.1'
      sub:
      - User (`~/.claude/CLAUDE.md`, not shared), project (`.claude/CLAUDE.md` or root), directory-level.
      - '`@import` for modular files; `.claude/rules/` to split a monolith.'
      - '`/memory` to see what''s actually loaded.'
    - id: d3-2
      text: Commands and skills
      ts: '3.2'
      sub:
      - '`.claude/commands/` (shared) vs. `~/.claude/commands/` (personal).'
      - '`SKILL.md` frontmatter: `context: fork`, `allowed-tools`, `argument-hint`.'
      - Personal skill variants under different names.
      - Skills = on demand; CLAUDE.md = always loaded.
    - id: d3-3
      text: >-
        Path-scoped rules: `paths:` glob frontmatter applies regardless of directory (e.g. `**/*.test.tsx`)
        and beats subdirectory CLAUDE.md for conventions spread across the codebase.
      ts: '3.3'
    - id: d3-4
      text: Plan mode vs. direct execution
      ts: '3.4'
      sub:
      - 'Plan mode: architectural, multi-file, multiple valid approaches.'
      - 'Direct: well-scoped, single-file changes.'
      - Plan-then-execute combos; Explore subagent isolates verbose discovery.
    - id: d3-5
      text: Iterative refinement
      ts: '3.5'
      sub:
      - 2–3 concrete input/output examples.
      - Test-first iteration.
      - The interview pattern.
      - Interacting issues in one message; independent issues sequentially.
    - id: d3-6
      text: CI/CD
      ts: '3.6'
      sub:
      - '`-p` / `--print` (no interactive hang).'
      - '`--output-format json` + `--json-schema`.'
      - CLAUDE.md supplies CI context (test standards, fixtures).
      - Independent review instance, not self-review.
      - >-
        Feed prior findings back so only new or unaddressed issues are reported; pass existing tests to
        avoid duplicates.
  - title: 'Build · Exercise 2: team Claude Code setup'
    items:
    - id: b3-md
      text: Project-level CLAUDE.md with coding and testing standards; verify it applies consistently.
      tag: Ex2
    - id: b3-rules
      text: >-
        `.claude/rules/` files with globs (`src/api/**/*`, `**/*.test.*`); verify each loads **only**
        for matching files.
      tag: Ex2
    - id: b3-skill
      text: >-
        Project skill in `.claude/skills/` with `context: fork` and restricted `allowed-tools`; verify
        the main context stays clean.
      tag: Ex2
    - id: b3-mcp
      text: >-
        `.mcp.json` server with `${ENV_VAR}` credentials plus a personal server in `~/.claude.json`; verify
        both are available at once.
      tag: Ex2
    - id: b3-plan
      text: >-
        Plan mode vs. direct on three tasks: single-file bug fix, multi-file library migration, new feature
        with multiple valid approaches. Note where plan mode earned its keep.
      tag: Ex2
    - id: b3-import
      text: Use `@import` to pull a standards file into a package-level CLAUDE.md; check with `/memory`.
      tag: added
    - id: b3-user
      text: >-
        Put an instruction in user-level CLAUDE.md, confirm a “teammate” doesn't get it, then move it
        to project level.
      tag: added
    - id: b3-cmd
      text: Create a project slash command in `.claude/commands/` and a skill using `argument-hint`.
      tag: added
  - title: Build · CI / headless
    items:
    - id: b3-ci1
      text: >-
        Script `claude -p "…" --output-format json --json-schema <schema>` that reviews a diff and outputs
        machine-parseable findings.
      tag: added
    - id: b3-ci2
      text: Re-run after a new commit with prior findings in context; confirm no duplicate comments.
      tag: added
    - id: b3-ci3
      text: Generate tests with existing tests in context; confirm no duplicated scenarios.
      tag: added
  - title: Self-check
    items:
    - id: d3-sc
      text: >-
        Classify 10 of your own tasks from your day-to-day work as plan mode or direct execution, with
        a one-line reason each.
- id: s5
  'no': '5'
  title: Prompt Engineering & Structured Output
  domain: 4
  groups:
  - title: Concepts to own
    items:
    - id: d4-1
      text: Explicit categorical criteria beat “be conservative”
      ts: '4.1'
      sub:
      - False positives erode trust in accurate categories too.
      - Temporarily disable noisy categories.
      - Define severity levels with code examples.
    - id: d4-2
      text: Few-shot prompting
      ts: '4.2'
      sub:
      - 2–4 examples targeting **ambiguous** cases, with reasoning for the choice.
      - Format consistency and generalization.
      - Reduce extraction hallucination across varied layouts.
    - id: d4-3
      text: '`tool_use` + JSON schema'
      ts: '4.3'
      sub:
      - Eliminates *syntax* errors, not *semantic* ones.
      - '`"any"` when doc type is unknown; forced tool to run a step first.'
      - Nullable/optional fields prevent fabrication.
      - '`"unclear"` and `"other"` + detail enums; normalization rules in the prompt.'
    - id: d4-4
      text: Validation-retry loops
      ts: '4.4'
      sub:
      - Send back document + failed extraction + specific error.
      - Retry fixes format/structure, **not** information missing from the source.
      - '`detected_pattern` for false-positive analysis.'
      - '`calculated_total` vs. `stated_total` plus `conflict_detected`.'
    - id: d4-5
      text: Message Batches API
      ts: '4.5'
      sub:
      - 50% cheaper, up to 24h, **no SLA**, no mid-request multi-turn tools, `custom_id` correlation.
      - Non-blocking jobs only.
      - Submission cadence vs. SLA (every 4h → 30h guarantee).
      - Resubmit only failed `custom_id`s; refine the prompt on a sample first.
    - id: d4-6
      text: Review architecture
      ts: '4.6'
      sub:
      - 'Self-review is weak: the model keeps its own reasoning.'
      - An independent instance catches more.
      - Per-file passes + a cross-file integration pass.
      - Per-finding confidence to route review effort.
  - title: 'Build · Exercise 3: structured extraction pipeline'
    items:
    - id: b5-schema
      text: >-
        Extraction schema with required, optional and nullable fields plus an `"other"` + detail enum.
        Feed docs with missing fields; verify **null, not fabricated values**.
      tag: Ex3
    - id: b5-retry
      text: Validation-retry loop (Pydantic or JSON Schema). Log which errors retry fixes vs. which it
        can't.
      tag: Ex3
    - id: b5-few
      text: >-
        Few-shot examples across varied formats (inline citations vs. bibliography, narrative vs. table);
        compare before and after.
      tag: Ex3
    - id: b5-batch
      text: >-
        Batch ~100 docs via Message Batches API; handle failures by `custom_id`, resubmit with fixes (chunk
        oversized docs), compute total time vs. an SLA.
      tag: Ex3
    - id: b5-conf
      text: >-
        Field-level confidence → route low-confidence to human review → analyze accuracy **by doc type
        and field**.
      tag: Ex3
    - id: b5-totals
      text: Add `calculated_total` / `stated_total` / `conflict_detected` to an invoice-style schema.
      tag: added
    - id: b5-choice
      text: Forced `tool_choice` so `extract_metadata` runs before enrichment; `"any"` when doc type is
        unknown.
      tag: added
  - title: Build · Review quality
    items:
    - id: b5-crit
      text: >-
        Rewrite a noisy review prompt (“check comments are accurate”) with explicit report/skip criteria
        and 2–3 few-shot examples; compare false positives.
      tag: added
    - id: b5-pass
      text: >-
        Single-pass review of a 10+ file diff vs. per-file passes plus an integration pass; note inconsistencies.
      tag: added
    - id: b5-self
      text: Same-session self-review vs. a fresh instance reviewing the same code; compare what each catches.
      tag: added
- id: s6
  'no': '6'
  title: Context Management & Reliability
  domain: 5
  groups:
  - title: Concepts to own
    items:
    - id: d5-1
      text: Long context
      ts: '5.1'
      sub:
      - 'Summarization loses numbers, dates, commitments: keep a persistent **case-facts block**.'
      - 'Lost-in-the-middle: key summaries first, section headers.'
      - '**Trim verbose tool outputs** to relevant fields.'
      - Upstream agents return structured data, not reasoning chains; pass complete history each request.
    - id: d5-2
      text: Escalation
      ts: '5.2'
      sub:
      - 'Triggers: explicit human request (honor immediately), policy gap or silence, inability to progress.'
      - '**Not** sentiment or self-rated confidence.'
      - Acknowledge frustration but offer to resolve; escalate if they reiterate.
      - Multiple matches → ask for an identifier.
    - id: d5-3
      text: Error propagation
      ts: '5.3'
      sub:
      - 'Structured context: failure type, attempt, partial results, alternatives.'
      - Local recovery for transient errors.
      - 'Anti-patterns: silent “success” with empty results, killing the whole workflow on one failure.'
      - Coverage annotations in the output.
    - id: d5-4
      text: Large codebase exploration
      ts: '5.4'
      sub:
      - Context degradation in long sessions.
      - Scratchpad files; subagent delegation.
      - Summarize each phase before spawning the next.
      - Manifest-based crash recovery; `/compact`.
    - id: d5-5
      text: Human review
      ts: '5.5'
      sub:
      - A 97% aggregate can hide bad segments.
      - Stratified sampling of high-confidence outputs.
      - Field-level confidence calibrated on labeled sets.
      - Validate by doc type and field before cutting review.
    - id: d5-6
      text: Provenance
      ts: '5.6'
      sub:
      - Claim → source mappings preserved through synthesis.
      - Annotate conflicts instead of picking one value; dates prevent false contradictions.
      - Separate well-established from contested findings.
      - 'Render by content type: tables for financials, prose for news, lists for technical findings.'
  - title: Build · Exercise 4, part 2
    items:
    - id: b6-struct
      text: >-
        Subagent output: claim, evidence excerpt, source URL/doc, publication date. Verify synthesis preserves
        attribution.
      tag: Ex4
    - id: b6-timeout
      text: >-
        Simulate a subagent timeout: coordinator gets structured error context, proceeds with partial
        results, annotates coverage gaps.
      tag: Ex4
    - id: b6-conflict
      text: >-
        Feed two credible sources with conflicting statistics: keep both with attribution, separate established
        from contested.
      tag: Ex4
    - id: b6-empty
      text: Distinguish “search failed” from “zero results” in the error payload.
      tag: added
    - id: b6-manifest
      text: >-
        Each subagent writes state to a known location; kill and resume so the coordinator restores from
        a manifest.
      tag: added
  - title: Build · Context hygiene
    items:
    - id: b6-facts
      text: >-
        In a long multi-issue support conversation (reuse Ex1), keep a case-facts block outside summarized
        history; confirm facts survive summarization.
      tag: added
    - id: b6-trim
      text: Trim an order-lookup result from ~40 fields to the ~5 relevant ones before it enters context.
      tag: added
    - id: b6-scratch
      text: >-
        In Claude Code on a large repo: scratchpad file for findings, delegate “find all X” to subagents,
        `/compact` when context fills.
      tag: added
- id: s7
  'no': '7'
  title: Drills & readiness gates
  callout: >-
    There is no official practice exam. It was retired in the June 2026 move to Pearson. These gates replace
    it.
  groups:
  - items:
    - id: r-sample
      text: >-
        **Sample questions:** work the guide's 12 samples and write *why every wrong option is wrong*
        (over-engineered, wrong layer, probabilistic where deterministic is needed, different problem).
    - id: r-drills
      text: >-
        **Self-authored drills:** for each of the 6 scenarios, write 3 exam-style questions, at least
        one **multi-select**. Source the failure modes from your build logs.
    - id: r-teach
      text: >-
        **Teach-back:** explain each of the 30 task statements (coverage grid below) in 2–3 sentences
        without notes. Redo the build for any you can't.
    - id: r-mock
      text: >-
        Third-party mock exams (Tutorials Dojo, claudecertificationguide.com). Not verified by Anthropic;
        the guide wins any conflict. Target ≥80% before booking.
      tag: optional
    - id: r-gate
      text: >-
        **Booking gate:** every task statement ticked, sample-question reasoning comes easily, every exercise
        step done.
- id: s8
  'no': '8'
  title: Exam logistics
  groups:
  - items:
    - id: l-reg
      text: >-
        Register and pay in the Partner Academy, then schedule with Pearson VUE (online or test center).
        Registration is valid 5 years.
    - id: l-name
      text: Pearson profile name matches your government ID **exactly**.
      sub:
      - >-
        Mismatch: email certifications-support@anthropic.com, subject “Name Correction Request”, at least
        24h ahead (corrections take 24–48 business hours).
      - A mismatch at check-in forfeits the fee.
    - id: l-resched
      text: >-
        Know the cutoff: **reschedule or cancel at least 48 hours ahead** (FAQ says 48h, guide says 24h;
        use the stricter). Cancelling in Pearson doesn't refund; email support for that.
    - id: l-online
      text: Online proctoring ready
      sub:
      - Run Pearson's system test.
      - Check your work network or managed device isn't blocking it; use a test center if so.
      - 'Clear desk: no phone, watch, second monitor, notes or translation tools.'
    - id: l-retake
      text: Know the retake rules
      sub:
      - Full fee each attempt.
      - Waits of 14 / 30 / 90 days after the 1st / 2nd / 3rd failure.
      - Maximum 4 attempts per rolling 12 months.
      - Use the per-domain score report to target review.
    - id: l-final
      text: >-
        Final pass: re-read the guide's In-Scope list, Technologies appendix and the out-of-scope list
        below. No new material.
  out_of_scope:
  - Fine-tuning or training
  - API auth, billing, account management, OAuth, key rotation
  - Language/framework specifics beyond tool and schema config
  - Deploying or hosting MCP servers
  - Model internals, Constitutional AI, RLHF
  - Embeddings and vector databases
  - Computer use
  - Vision
  - Streaming and server-sent events
  - Rate limits, quotas, pricing math
  - Cloud provider configs (AWS, GCP, Azure)
  - Benchmarks and model comparisons
  - Prompt caching internals
  - Tokenization
