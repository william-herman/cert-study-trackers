# CompTIA Network+ study tracker data. Schema: see SCHEMA.md.
slug: n10-009
code: N10-009
name: CompTIA Network+
issuer: CompTIA
category: cybersecurity
kind: exam
confidence: source-traced
blueprint:
  title: Network+ N10-009 V9 exam objectives
  version: '6.0'
  published: CompTIA
last_checked: '2026-10-09'
summary: >-
  Study plan for CompTIA's vendor-neutral networking exam: all 25 objectives across five weighted domains, with
  hands-on practice for the performance-based questions and the exam and renewal rules.
snapshot:
  title: Exam snapshot
  items:
  - Up to **90 questions in 90 minutes**, multiple choice plus **performance-based** (hands-on simulations)
  - Scaled 100–900, **720 to pass**
  - 'Recommended: CompTIA A+ and 9–12 months as a junior network admin or support tech'
  - English, German, Japanese, Portuguese, Spanish
  - Valid 3 years; renew through CompTIA's continuing education program
  - V9 launched June 2024; CompTIA estimates retirement in 2027
lens:
  title: The lens for every question
  intro: 'From the objectives'' own verbs:'
  body:
  - Many objectives start with **Given a scenario**. Expect to configure, troubleshoot or choose, not just define.
  - Troubleshooting is the heaviest domain at 24%, and CompTIA's methodology (5.1) is the order the exam expects.
  - It's vendor-neutral. Learn the concept and the standard, not one vendor's menu.
  prompts:
  - Which OSI layer is this problem at?
  - What's the next step in the troubleshooting methodology?
  - What changed, and what's the least disruptive fix?
domains:
- {id: 1, name: Networking Concepts, short: Concepts, weight: 23}
- {id: 2, name: Network Implementation, short: Implementation, weight: 20}
- {id: 3, name: Network Operations, short: Operations, weight: 19}
- {id: 4, name: Network Security, short: Security, weight: 14}
- {id: 5, name: Network Troubleshooting, short: Troubleshooting, weight: 24}
sections:
- id: s0
  'no': '0'
  title: Setup
  groups:
  - items:
    - {id: e-obj, text: 'Download the [Network+ V9 exam objectives (PDF)](https://lecbyo.files.cmp.optimizely.com/download/35a7403ab73211ef9dcda6f347fbf652), including the acronym list and the hardware and software list.'}
    - {id: e-acr, text: Work through the acronym list until you can expand and explain each one. CompTIA says candidates should know all of them.}
    - {id: e-lab, text: 'Set up a lab: a packet-capture tool such as Wireshark, plus a network simulator or a couple of spare devices.'}
- id: s1
  'no': '1'
  title: Networking Concepts
  short: Concepts
  domain: 1
  groups:
  - title: Objectives to own
    items:
    - {id: d1-1, ts: '1.1', text: 'The OSI reference model, layers 1–7.'}
    - {id: d1-2, ts: '1.2', text: 'Networking appliances, applications and functions: physical and virtual appliances, CDN, VPN, QoS, TTL.'}
    - {id: d1-3, ts: '1.3', text: 'Cloud concepts and connectivity: NFV, VPC, security groups and lists, gateways, deployment and service models.'}
    - {id: d1-4, ts: '1.4', text: 'Common ports, protocols, services and traffic types', sub: ['Memorize the port table in the objectives (FTP 20/21 through SIP 5060/5061).', 'IP types (ICMP, TCP, UDP, GRE, IPSec) and unicast, multicast, anycast and broadcast.']}
    - {id: d1-5, ts: '1.5', text: 'Transmission media and transceivers: 802.11, cellular, satellite, 802.3, fiber types, DAC, SFP/QSFP, connector types.'}
    - {id: d1-6, ts: '1.6', text: 'Network topologies, architectures and types, including spine and leaf, three-tier, collapsed core, north-south and east-west traffic.'}
    - {id: d1-7, ts: '1.7', text: 'Given a scenario, use appropriate IPv4 addressing: public vs. private, APIPA, RFC1918, subnetting with VLSM and CIDR.'}
    - {id: d1-8, ts: '1.8', text: 'Evolving use cases: SDN and SD-WAN, VXLAN, zero trust, SASE/SSE, infrastructure as code, IPv6.'}
  - title: Practice
    items:
    - {id: p1-subnet, tag: added, text: 'Subnet by hand until you can split a /24 into any requested size without a calculator.'}
- id: s2
  'no': '2'
  title: Network Implementation
  short: Implementation
  domain: 2
  groups:
  - title: Objectives to own
    items:
    - {id: d2-1, ts: '2.1', text: 'Routing technologies: static and dynamic routing (BGP, EIGRP, OSPF), route selection, NAT/PAT, FHRP, VIP, subinterfaces.'}
    - {id: d2-2, ts: '2.2', text: 'Given a scenario, configure switching: VLANs and SVIs, native and voice VLANs, 802.1Q, link aggregation, spanning tree, MTU.'}
    - {id: d2-3, ts: '2.3', text: 'Given a scenario, select and configure wireless: channels and width, 2.4/5/6 GHz, SSIDs, WPA2/WPA3, guest networks, antennas.'}
    - {id: d2-4, ts: '2.4', text: 'Physical installations: IDF/MDF, racks, cabling, power (UPS, PDU) and environmental factors.'}
  - title: Practice
    items:
    - {id: p2-vlan, tag: added, text: 'In a simulator, build two VLANs joined by a router or SVI, then confirm traffic crosses only where you expect it to.'}
- id: s3
  'no': '3'
  title: Network Operations
  short: Operations
  domain: 3
  groups:
  - title: Objectives to own
    items:
    - {id: d3-1, ts: '3.1', text: 'Organizational processes: documentation and diagrams, life-cycle management, change and configuration management.'}
    - {id: d3-2, ts: '3.2', text: 'Given a scenario, use network monitoring: SNMP, flow data, packet capture, baselines, log aggregation and SIEM, port mirroring.'}
    - {id: d3-3, ts: '3.3', text: 'Disaster recovery: RPO, RTO, MTTR, MTBF, cold/warm/hot sites, active-active vs. active-passive, testing.'}
    - {id: d3-4, ts: '3.4', text: 'Given a scenario, implement IPv4 and IPv6 services: DHCP and SLAAC, DNS records and zones, NTP, PTP, NTS.'}
    - {id: d3-5, ts: '3.5', text: 'Network access and management: site-to-site and client VPNs, SSH, GUI, API, console, jump boxes, in-band vs. out-of-band.'}
- id: s4
  'no': '4'
  title: Network Security
  short: Security
  domain: 4
  groups:
  - title: Objectives to own
    items:
    - {id: d4-1, ts: '4.1', text: 'Basic security concepts: encryption, PKI, IAM and authentication methods, physical security, deception, CIA, compliance, segmentation.'}
    - {id: d4-2, ts: '4.2', text: 'Attacks and their impact: DoS/DDoS, VLAN hopping, MAC flooding, ARP and DNS poisoning or spoofing, rogue devices, evil twin, on-path, social engineering.'}
    - {id: d4-3, ts: '4.3', text: 'Given a scenario, apply defenses: device hardening, NAC (port security, 802.1X), key management, ACLs, filtering, zones and screened subnets.'}
- id: s5
  'no': '5'
  title: Network Troubleshooting
  short: Troubleshooting
  domain: 5
  note: The heaviest domain.
  groups:
  - title: Objectives to own
    items:
    - {id: d5-1, ts: '5.1', text: 'The troubleshooting methodology, step by step, from identifying the problem to documenting findings.'}
    - {id: d5-2, ts: '5.2', text: 'Given a scenario, troubleshoot cabling and physical interfaces: cable faults, interface counters, PoE, transceiver mismatch.'}
    - {id: d5-3, ts: '5.3', text: 'Given a scenario, troubleshoot network services: STP, VLAN assignment, ACLs, routing tables, pool exhaustion, wrong gateway, IP or mask.'}
    - {id: d5-4, ts: '5.4', text: 'Given a scenario, troubleshoot performance: congestion, bottlenecks, latency, packet loss, jitter, wireless interference and roaming.'}
    - {id: d5-5, ts: '5.5', text: 'Given a scenario, pick the right tool: ping, traceroute, nslookup, dig, tcpdump, netstat, Nmap, LLDP/CDP, hardware testers, show commands.'}
  - title: Practice
    items:
    - {id: p5-tools, tag: added, text: 'Run every command-line tool in 5.5 on your own machine and explain what each line of output means.'}
    - {id: p5-break, tag: added, text: 'In your lab, break something on purpose (wrong mask, wrong VLAN, bad gateway) and fix it using the 5.1 steps, out loud.'}
- id: s6
  'no': '6'
  title: Readiness and logistics
  short: Readiness
  groups:
  - items:
    - {id: r-ptest, text: 'Try CompTIA''s free [Network+ practice questions](https://www.comptia.org/en-us/certifications/network/practice-questions/).'}
    - {id: r-pbq, text: Practice performance-based questions under time pressure. They often come first; you can flag them and return later.}
    - {id: r-gate, text: '**Booking gate:** every objective ticked, subnetting is automatic, and you can name the tool for any symptom.'}
    - {id: l-renew, text: 'After you pass, plan renewal: the certification is valid 3 years and renews through CompTIA''s continuing education program.'}
