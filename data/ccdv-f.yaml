# CCDV-F study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: ccdv-f
code: CCDV-F
name: Claude Certified Developer – Foundations
issuer: Anthropic
category: ai
kind: exam
confidence: source-traced
blueprint:
  title: CCDV-F Exam Guide
  version: '1.0'
  published: July 2026
last_checked: '2026-10-01'
summary: >-
  Study plan for the CCDV-F exam: all 25 weighted skills across eight domains, the free prep course and
  recommended courses, a capstone build that exercises the whole blueprint, and the exam rules.
snapshot:
  title: Exam snapshot
  items:
  - 53 items in 120 minutes (about 135 minutes at your seat)
  - Multiple-choice and **multiple-response**; each item says how many to pick
  - Scaled 100–1,000, **720 to pass**, with percent-correct by domain on the score report
  - $125 USD, proctored by Pearson VUE online or at a test center
  - 'Recommended: 1–5 years of software engineering, 6+ months with Claude or similar LLMs, Python and/or TypeScript'
  - Valid 12 months; on-time renewal is a **free** online assessment
lens:
  title: The lens for every question
  intro: 'From the reasoning behind the guide''s sample questions:'
  body:
  - Pick the mechanism built for the workload. Latency-tolerant, high-volume jobs belong on the Batch API; tweaking parallelism, `max_tokens` or the model doesn't solve that tradeoff.
  - Security comes from enforceable controls, like isolating untrusted content and least-privilege tools, not from asking the model nicely or changing temperature.
  - Prefer what's reusable and maintainable. Shared capabilities belong in an MCP server, not hard-coded into prompts or pasted into context.
  prompts:
  - Is this an enforceable control, or a request the model might ignore?
  - Which API mode and model fit this workload's latency and cost?
  - Will this still work when another app, or another engineer, needs it?
domains:
