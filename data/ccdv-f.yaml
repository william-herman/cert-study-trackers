- {id: 2, name: Applications and Integration, short: Applications & Integration, weight: 33.1}
- {id: 3, name: Claude Code, short: Claude Code, weight: 3.1}
- {id: 4, name: 'Eval, Testing, and Debugging', short: 'Eval, Testing & Debugging', weight: 2.6}
- {id: 5, name: Model Selection and Optimization, short: Model Selection & Optimization, weight: 16.8}
- {id: 6, name: Prompt and Context Engineering, short: Prompt & Context Engineering, weight: 11.0}
- {id: 7, name: Security and Safety, short: Security & Safety, weight: 8.1}
- {id: 8, name: Tools and MCPs, short: Tools & MCPs, weight: 10.6}
tag_legend:
- tag: guide
  style: ex
  meaning: preparation steps from section 7 of the exam guide
- tag: added
  style: added
  meaning: extra hands-on practice for skills the guide doesn't give an exercise for
- tag: optional
  style: optional
  meaning: not counted toward progress
sections:
- id: s0
  'no': '0'
  title: Setup
  note: Do this first.
  groups:
  - items:
    - id: e-guide
      text: >-
        Read the full [CCDV-F Exam Guide v1.0 (PDF)](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542875%2FClaude+Certified+Developer+%E2%80%93+Foundations+Exam+Guide.pdf)
        cover to cover, including the skill weights in section 6.
    - id: e-policies
      text: >-
        Read the [Certification Terms and Conditions](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F34hhd92iyp94a0gtbr15cy5jk%2Fpublic%2F1782870634%2FCertification+Terms+and+Conditions.pdf)
        and [Exam Policy](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F34hhd92iyp94a0gtbr15cy5jk%2Fpublic%2F1782870704%2FAnthropic+Certification+Exam+Policy.pdf).
    - id: e-env
      text: Environment ready
      sub:
      - Python or TypeScript
      - A Claude API key
      - Claude Code installed
      - The Claude Agent SDK installed
      - A repo for the capstone build (section 10)
    - id: e-self
      tag: guide
      text: Self-assess against all 25 skills below. Mark the ones you couldn't explain or build today; that's your study order.
- id: s1
  'no': '1'
  title: Free Anthropic courses
  note: Take each course just before the domain it supports, not all up front.
  callout: >-
    Weight your time. Applications and Integration alone is a third of the exam (33.1%), while Claude Code
    and Eval, Testing & Debugging together are under 6%.
  groups:
  - title: The prep course
    items:
    - id: c-prep
      text: >-
        Register for the free [Claude Certified Developer – Foundations Prep Course](https://anthropic-partners.skilljar.com/path/claude-certified-developer-foundations)
        (5 lessons, about 13 hours).
      sub:
      - '*MSO Foundations*: model fundamentals, before Domain 5.'
      - '*Production-Grade Prompting, Agents & Tool Use*: before Domains 1, 6 and 8.'
      - '*Claude Code, MCP & Integration*: before Domains 2, 3 and 8.'
      - '*Production Engineering, Evals & Security*: before Domains 4 and 7.'
      - '*Accelerators & IP Contribution*: after the capstone build.'
  - title: Courses the certification page recommends
    items:
    - id: c-api
      text: '[Building with the Claude API](https://anthropic.skilljar.com/claude-with-the-anthropic-api): before Domains 2 and 5.'
    - id: c-cc
      text: '[Claude Code in Action](https://anthropic.skilljar.com/claude-code-in-action): before Domain 3.'
    - id: c-mcp
      text: '[Introduction to Model Context Protocol](https://anthropic.skilljar.com/introduction-to-model-context-protocol): before Domain 8.'
  - title: Also on the prep course's recommended list
    items:
    - {id: c-mcp-adv, tag: optional, text: '[Model Context Protocol: Advanced Topics](https://anthropic.skilljar.com/model-context-protocol-advanced-topics)'}
    - {id: c-p101, tag: optional, text: '[Claude Platform 101](https://anthropic.skilljar.com/claude-platform-101)'}
    - {id: c-cc101, tag: optional, text: '[Claude Code 101](https://anthropic.skilljar.com/claude-code-101)'}
    - {id: c-101, tag: optional, text: '[Claude 101](https://anthropic.skilljar.com/claude-101), [AI Fluency: Framework & Foundations](https://anthropic.skilljar.com/ai-fluency-framework-foundations) and [AI Capabilities and Limitations](https://anthropic.skilljar.com/ai-capabilities-and-limitations)'}
- id: s2
  'no': '2'
  title: Agents and Workflows
  short: Agents & Workflows
  domain: 1
  groups:
  - title: Skills to own
    items:
    - id: d1-1
      ts: '1.1'
      text: Agent architecture (4.5%)
      sub:
      - When to use a workflow versus an agent.
      - Manager/supervisor hierarchies, and how subagents improve task execution.
    - id: d1-2
      ts: '1.2'
      text: Agent construction with Claude (5.3%)
      sub:
      - The Claude Agent SDK, custom agent loops and harnesses.
      - Managed deployment models (self-hosted vs. Anthropic-hosted).
      - Hooks for deterministic actions.
    - id: d1-3
      ts: '1.3'
      text: Agent patterns and frameworks (4.9%)
      sub:
      - Tool-use loops, sub-agents, memory, context-window management.
      - Agentic frameworks such as Strands, LangGraph and PydanticAI for multi-step work.
  - title: Practice
    items:
    - id: p1-agent
      tag: added
      text: Build the same task twice, once as a fixed workflow and once as an agent. Write down when each was the better choice.
    - id: p1-hook
      tag: added
      text: Add a hook that makes one action deterministic (for example, always log or block a specific tool call).
- id: s3
  'no': '3'
  title: Applications and Integration
  short: Applications & Integration
  domain: 2
  note: The heaviest domain, a third of the exam.
  groups:
  - title: Skills to own
    items:
    - {id: d2-1, ts: '2.1', text: 'Understanding requirements (3.4%): turning business requirements and solution architecture into functional and infrastructure requirements.'}
    - {id: d2-2, ts: '2.2', text: 'Systems life cycle (2.8%): frameworks for developing, implementing, operating and maintaining IT systems.'}
    - id: d2-3
      ts: '2.3'
      text: Claude API mechanics (6.8%)
      sub:
      - Messages, tools, streaming, vision, thinking, caching.
      - Invoking Claude through third-party vendors; Messages API data access patterns.
      - The Batch API, and when to choose realtime versus batch.
    - id: d2-4
      ts: '2.4'
      text: Software engineering foundations (7.4%)
      sub:
      - REST APIs, JSON, asynchronous programming.
      - Version control, SDLC integration, code review, small- and large-scale refactoring.
    - id: d2-5
      ts: '2.5'
      text: Claude application design (8.6%), the single heaviest skill
      sub:
      - How Claude interprets instructions across Claude Code, Desktop, claude.ai, the API and SDKs.
      - Content boundaries, schema design, session hygiene, plugin management.
    - id: d2-6
      ts: '2.6'
      text: Configuration management (4.1%)
      sub:
      - CLAUDE.md files and settings.json.
      - Model version pinning, prompt versioning, plugin dependencies.
  - title: Practice
    items:
    - id: p2-batch
      tag: added
      text: Run the same 50 requests through the Messages API and the Batch API. Compare cost and turnaround, and write down which workloads belong on each.
    - id: p2-pin
      tag: added
      text: Pin a model version and version one prompt in your capstone repo, so a model or prompt change shows up as a reviewable diff.
- id: s4
  'no': '4'
  title: Claude Code
  short: Claude Code
  domain: 3
  groups:
  - title: Skills to own
    items:
    - id: d3-1
      ts: '3.1'
      text: Claude Code operation (3.1%)
      sub:
      - 'Core components: Rules, Skills, Commands, Agents, Agent Memory.'
      - Session management, built-in and custom slash commands, headless, streaming and auto modes.
      - The CLAUDE.md hierarchy, repository initialization, settings.json.
  - title: Practice
    items:
    - id: p3-setup
      tag: added
      text: Initialize your capstone repo with Claude Code, add a project CLAUDE.md and one custom slash command, then run one task headless.
- id: s5
  'no': '5'
  title: Eval, Testing, and Debugging
  short: Eval & Debugging
  domain: 4
  groups:
  - title: Skills to own
    items:
    - id: d4-1
      ts: '4.1'
      text: Debugging and error handling (2.6%)
      sub:
      - Identifying error types and choosing a recovery strategy.
      - Trace analysis to find failure modes.
      - Isolating whether a problem comes from the integration layer or the model's output.
  - title: Practice
    items:
    - id: p4-eval
      tag: guide
      text: Add simple evaluation practices to your capstone build, such as a small test set with expected outputs that runs before every change.
    - id: p4-isolate
      tag: added
      text: Break your app twice, once in your own code and once with a bad prompt, and practice telling the two apart from traces alone.
- id: s6
  'no': '6'
  title: Model Selection and Optimization
  short: Model Selection
  domain: 5
  note: The second-heaviest domain.
  groups:
  - title: Skills to own
    items:
    - id: d5-1
      ts: '5.1'
      text: LLM fundamentals (5.2%)
      sub:
      - Tokens, context windows, sampling, non-determinism, next-token generation.
      - Fast mode, extended thinking, adaptive thinking, effort levels.
      - Zero-shot, single-shot and multi-shot prompting.
    - {id: d5-2, ts: '5.2', text: 'Technical fundamentals (6.1%): integrating with SDKs that wrap REST APIs, and websockets.'}
    - id: d5-3
      ts: '5.3'
      text: Model selection and tradeoffs (2.7%)
      sub:
      - Opus vs. Sonnet vs. Haiku use cases, and adaptive thinking support.
      - Quality, latency and cost tradeoffs, and breaking behavior changes across model releases.
    - id: d5-4
      ts: '5.4'
      text: Cost and token management (2.8%)
      sub:
      - Token usage tracking and cost modeling.
      - Prompt caching and cache checkpointing.
  - title: Practice
    items:
    - id: p5-cost
      tag: guide
      text: Practice managing tokens and cost. Log token usage per request in your capstone build and estimate monthly cost at 10× traffic.
    - id: p5-cache
      tag: added
      text: Add prompt caching to a request with a long, stable prefix and measure the difference in cost and latency.
- id: s7
  'no': '7'
  title: Prompt and Context Engineering
  short: Prompt & Context
  domain: 6
  groups:
  - title: Skills to own
    items:
    - id: d6-1
      ts: '6.1'
      text: Context engineering (3.8%)
      sub:
      - Context window management and preventing drift and bloat (tool output pruning, compaction).
      - Isolating context through subagents or multi-step workflows.
    - id: d6-2
      ts: '6.2'
      text: Prompt engineering (4.6%)
      sub:
      - Instruction clarity, few-shot examples, system versus user placement, output constraints.
      - Iterative refinement and input sanitization.
    - id: d6-3
      ts: '6.3'
      text: Output handling (2.6%)
      sub:
      - Structured output patterns, response validation, defensive parsing.
      - Skepticism toward confident output.
  - title: Practice
    items:
    - id: p6-prompts
      tag: guide
      text: Practice writing prompts and system instructions, and iterate on one until it handles your hardest test inputs.
    - id: p6-parse
      tag: added
      text: Validate structured output against a schema and handle the failure path, rather than assuming the JSON is well-formed.
- id: s8
  'no': '8'
  title: Security and Safety
  short: Security & Safety
  domain: 7
  groups:
  - title: Skills to own
    items:
    - id: d7-1
      ts: '7.1'
      text: AI application security (3.2%)
      sub:
      - Prompt injection awareness and mitigation, jailbreak defense, untrusted input handling.
      - Data leakage prevention, PII handling, authentication, authorization, confidentiality and integrity.
    - {id: d7-2, ts: '7.2', text: 'Guardrails and safe deployment (2.3%): content policy, layered guardrails, secure-by-design, least privilege.'}
    - {id: d7-3, ts: '7.3', text: 'Claude hooks (1.0%): using hooks as guardrails to prevent destructive actions.'}
    - {id: d7-4, ts: '7.4', text: 'Identity, secrets and key management (1.6%): managing credentials and API keys across development and production, and monitoring authorized access.'}
  - title: Practice
    items:
    - id: p7-guard
      tag: guide
      text: Implement guardrails in your capstone build, including simple security practices.
    - id: p7-inject
      tag: added
      text: Feed your app a document containing injected instructions. Confirm untrusted content can't trigger a sensitive tool, and that it's enforced in code, not just the prompt.
    - id: p7-secrets
      tag: added
      text: Move every key out of code into environment variables or a secrets manager, and confirm none are in your git history.
- id: s9
  'no': '9'
  title: Tools and MCPs
  short: Tools & MCPs
  domain: 8
  groups:
  - title: Skills to own
    items:
    - id: d8-1
      ts: '8.1'
      text: Tool implementation (4.4%)
      sub:
      - Tool use and function calling, tool descriptions, error handling.
      - Agentic harness dispatch, client-side vs. server-side tools, approval patterns, building a good tool set.
    - {id: d8-2, ts: '8.2', text: 'MCP server development (2.1%): authoring and deploying servers; resources, tools and prompts; stdio, sockets, client vs. server.'}
    - {id: d8-3, ts: '8.3', text: 'Agentic customization (4.1%): choosing between built-in tools, custom tools, Skills and MCPs for a given use case.'}
  - title: Practice
    items:
    - id: p8-mcp
      tag: guide
      text: Create a custom tool or MCP server and connect it to your capstone build.
    - id: p8-choose
      tag: added
      text: For three capabilities you'd like Claude to have, decide whether each should be a built-in tool, a custom tool, a Skill or an MCP server, and write down why.
- id: s10
  'no': '10'
  title: Capstone build
  short: Capstone build
  note: >-
    The guide asks you to build and operate at least one Claude application. These checkpoints cover what it
    says that app should include.
  groups:
  - items:
    - {id: b-api, tag: guide, text: The app calls the Claude API.}
    - {id: b-tools, tag: guide, text: It integrates one or more tools.}
    - {id: b-prompt, tag: guide, text: It applies basic prompt and context engineering.}
    - {id: b-sec, tag: guide, text: It includes simple security practices.}
    - {id: b-eval, tag: guide, text: It includes simple evaluation practices.}
    - {id: b-agent, tag: guide, text: You've built an agent or workflow and configured Claude Code for the repo, as the guide's list of developer competencies asks.}
    - {id: b-docs, tag: guide, text: 'You''ve reviewed the official docs for each area you used: the Claude API, models, prompt engineering, Claude Code, Skills and MCP.'}
- id: s11
  'no': '11'
  title: Readiness
  short: Readiness
  callout: >-
    There is no practice exam. Anthropic retired it in the move to Pearson; the guide's sample questions are the
    only official practice.
  groups:
  - items:
    - id: r-samples
      tag: guide
      text: Work the three sample questions in section 8 of the guide. For each, explain why every wrong option is wrong before reading the rationale.
    - id: r-teach
      text: Explain each of the 25 skills in a sentence or two, with an example from your capstone build, without notes.
    - id: r-gate
      text: '**Booking gate:** every skill ticked, the capstone build checkpoints done, and the sample-question reasoning comes easily.'
- id: s12
  'no': '12'
  title: Exam logistics
  short: Logistics
  groups:
  - items:
    - id: l-reg
      text: Register in the Anthropic Partner Academy, then schedule with Pearson VUE, online or at a test center.
    - id: l-name
      text: >-
        Your registration name must match your government ID **exactly**. To fix it, email
        certifications-support@anthropic.com before you schedule.
    - id: l-resched
      text: >-
        **Reschedule or cancel at least 48 hours ahead.** The guide says 24 hours, but the newer certification FAQ says
        48; use the stricter one. Cancelling in Pearson doesn't trigger a refund.
    - id: l-online
      text: Online proctoring
      sub:
      - Stay in view of the webcam for the whole session.
      - 'Clear desk: no notes, phone, smart watch, headphones or second monitor.'
      - Run Pearson's system test first; use a test center if a managed device blocks it.
    - id: l-retake
      text: Retakes
      sub:
      - Full fee each attempt.
      - Waits of 14 / 30 / 90 days after the 1st / 2nd / 3rd failure.
      - At most 4 attempts in a rolling 12 months.
    - id: l-renew
      text: >-
        After passing, renew before 12 months are up with the free, non-proctored assessment. If it lapses, you retake
        the full exam at full price.
