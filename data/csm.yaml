# CSM study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: csm
code: CSM
name: Certified ScrumMaster
issuer: Scrum Alliance
kind: exam
confidence: field-validated
blueprint:
  title: CSM Learning Objectives
  version: '2022'
  published: updated Jan 2022, with the Scrum Foundations Learning Objectives
last_checked: '2026-10-01'
summary: >-
  Study plan for the CSM: the required course, all 28 CSM and 24 Scrum Foundations learning objectives the
  test is built on, the Scrum Guide and Agile Manifesto, and the test and renewal rules.
domain_label: Category
lens:
  title: The lens for every question
  body:
  - >-
    Scrum Alliance's objectives start from one idea: every implementation of Scrum is different, but the
    fundamental framework always stays the same.
  - The test is based on the CSM Learning Objectives and the Scrum Guide, so answer by the framework, not by local practice.
  - >-
    Many objectives ask you to *discuss*, *explain* or *apply*, not just define. Be ready to reason about a
    situation, not only recall terms.
  - >-
    From the author's experience: much of the material is covered hands-on in the course, but **review the
    content again after the course** to make sure you pass the test.
  prompts:
  - What does the Scrum Guide actually say here?
  - Which answer gives the agency to the team as a whole?
  - Is this the Scrum Master's accountability, the Product Owner's, or the Developers'?
snapshot:
  title: Test snapshot
  items:
  - '**Course required:** a 16-hour CSM course with a Certified Scrum Trainer, usually over 2–3 days'
  - 'From the author''s experience: expect to keep your **camera on throughout** an online course'
  - 50 multiple-choice questions in 60 minutes, online and **not proctored**
  - '**37 of 50 to pass (74%)**; you can bookmark questions but not pause'
  - 2 free attempts within 90 days of the welcome email, then $25 per attempt
  - Available in 13 languages
  - Renew every **2 years** with 20 SEUs and a $100 fee (one SEU per hour of learning)
