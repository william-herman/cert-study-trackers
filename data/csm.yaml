sections:
- id: s0
  'no': '0'
  title: Before the course
  note: The course is required; you can't take the test without it.
  groups:
  - items:
    - id: c-find
      text: >-
        Choose a CSM course taught by a Certified Scrum Trainer on Scrum Alliance's
        [course search](https://www.scrumalliance.org/courses-events/search?ctyp=Csm). The course fee includes two test attempts.
    - id: c-guide
      text: Read the [Scrum Guide](https://scrumguides.org/scrum-guide.html) (2020) once before class, so the course is your second pass.
    - id: c-manifesto
      text: >-
        Read the [Manifesto for Agile Software Development](https://agilemanifesto.org/): the four values and the
        [12 principles](https://agilemanifesto.org/principles.html).
    - id: c-values
      text: Read Scrum Alliance's page on the [Scrum values](https://www.scrumalliance.org/about-scrum/values).
    - id: c-los
      text: >-
        Skim the [CSM Learning Objectives](https://www.scrumalliance.org/media/certifications/los/csm_learning_objectives_2022.pdf)
        and [Scrum Foundations Learning Objectives](https://www.scrumalliance.org/media/certifications/los/scrum_foundations_learning_objectives_2022.pdf).
        They are the coverage grid at the bottom of this page.
- id: s1
  'no': '1'
  title: Scrum Foundations
  short: Foundations
  domain: 4
  note: Covered before or during every CSM course. Scrum theory, the team, events, and artifacts.
  groups:
  - title: Scrum theory
    items:
    - id: f-theory
      text: Scrum, empiricism and its three pillars
      sub:
      - 'Empiricism: knowledge comes from experience and deciding based on what is observed.'
      - 'Pillars: transparency, inspection, adaptation.'
      - 'The five Scrum values: commitment, focus, openness, respect, courage.'
    - id: f-iter
      text: Iterative and incremental delivery
      sub:
      - At least three benefits, e.g. earlier feedback, earlier value, lower risk.
      - What goes wrong when Scrum is only partially implemented.
      - How Scrum lines up with the Agile Manifesto's values and principles.
  - title: Team, events and artifacts
    items:
    - id: f-team
      text: How the Product Owner, Developers and Scrum Master work together to deliver Increments within a Sprint, and why cross-functional, self-managing teams help.
    - id: f-events
      text: Events, their purpose, participants, order and timeboxes
      sub:
      - The Sprint is one month or less; how to choose a suitable length.
      - 'For a one-month Sprint: Sprint Planning up to 8 hours, Daily Scrum 15 minutes, Sprint Review up to 4 hours, Sprint Retrospective up to 3 hours.'
      - Why timeboxes help.
      - Product Backlog refinement is an ongoing activity, not an event. Know what happens in it and why teams make time for it.
    - id: f-artifacts
      text: Artifacts and their commitments
      sub:
      - Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done.
      - The Product Backlog is emergent; know typical attributes of a Product Backlog item.
      - The Sprint Backlog can change without endangering the Sprint Goal; the Sprint Goal itself doesn't change during the Sprint.
      - Several Increments can be created within one Sprint.
      - The Definition of Done evolves, and teams sharing a Product Backlog share one Definition of Done.
- id: s2
  'no': '2'
  title: 'CSM category 1: Scrum'
  short: Scrum
  domain: 1
  note: Accountabilities, events and the Definition of Done, at the depth of discussing and applying them.
  groups:
  - title: Concepts to own
    items:
    - id: s-acc
      text: Accountabilities of the Scrum Team, Scrum Master, Developers and Product Owner
      sub:
      - Why the Product Owner is one person, not a committee.
      - How the Product Owner keeps authority over the Product Backlog while collaborating with Developers and stakeholders.
    - id: s-events
      text: Events as inspect-and-adapt points
      sub:
      - At least one way each event can increase transparency.
      - Effects of skipping the Sprint Retrospective.
      - The Daily Scrum is run by and for the Developers; know how it differs from a status meeting and why its constraints exist.
      - When a Sprint can be cancelled early (only the Product Owner can, when the Sprint Goal becomes obsolete).
    - id: s-dod
      text: Definition of Done
      sub:
      - Advantages of a strong Definition of Done.
      - At least one way to create one.
  - title: Apply
    items:
    - id: s-run
      tag: practice
      text: >-
        Walk through a Sprint Planning, Sprint Review and Sprint Retrospective for a real or made-up team, as the
        course expects you to be able to run them. Note who does what in each.
- id: s3
  'no': '3'
  title: 'CSM category 2: Scrum Master core competencies'
  short: Core Competencies
  domain: 2
  note: Facilitation, and how it differs from teaching, mentoring and coaching.
  groups:
  - title: Concepts to own
    items:
    - id: k-fac
      text: Facilitation
      sub:
      - Situations where the Scrum Master serves the team or organization by facilitating.
      - At least three techniques for group decision making.
    - id: k-stances
      text: How facilitating, teaching, mentoring and coaching differ, and when each fits.
  - title: Apply
    items:
    - id: k-try
      tag: practice
      text: >-
        Facilitate one real decision with your team using a technique you haven't used before, then note what
        changed about the conversation.
- id: s4
  'no': '4'
  title: 'CSM category 3: Service to the Scrum Team, Product Owner, and organization'
  short: Service to Team, PO & Org
  domain: 3
  note: Leadership, technical quality, impediments and organizational change.
  groups:
  - title: Concepts to own
    items:
    - id: v-lead
      text: The Scrum Master as a leader who serves, with concrete scenarios.
    - id: v-debt
      text: Technical debt
      sub:
      - The impact of letting it accumulate.
      - Development practices that help deliver a high-quality Increment and reduce debt every Sprint.
    - id: v-po
      text: Ways the Scrum Master supports the Product Owner.
    - id: v-imp
      text: Impediments
      sub:
      - Organizational impediments that affect Scrum Teams.
      - How the Scrum Master helps the team with impediments, and at least one technique for resolving one.
    - id: v-org
      text: Organizational change
      sub:
      - At least one change to organizational design that adopting Scrum causes.
      - Why Scrum has no project manager.
  - title: Apply
    items:
    - id: v-list
      tag: practice
      text: >-
        List three impediments your team faces today. For each, say whether the team can remove it or the Scrum Master
        needs to work with the organization, and what you'd try first.
- id: s5
  'no': '5'
  title: Readiness
  short: Readiness
  groups:
  - items:
    - id: r-reread
      text: Re-read the Scrum Guide after the course. The test is based on it and on the learning objectives.
    - id: r-teach
      text: Explain every objective in the coverage grid out loud in a sentence or two, without notes.
    - id: r-gate
      text: '**Test gate:** every coverage item ticked. Take the test while the course is fresh, within the 90-day free window.'
- id: s6
  'no': '6'
  title: Test day and after
  short: Test & renewal
  groups:
  - items:
    - id: t-access
      text: Activate your account from the Scrum Alliance welcome email, then start the test from your dashboard.
    - id: t-env
      text: Use one computer and one browser (not Internet Explorer), turn off pop-up blockers, and don't use the browser's back or forward buttons during the test.
    - id: t-pace
      text: Pace at about 1 minute 10 seconds per question. Bookmark hard ones and come back; you can't pause.
    - id: t-renew
      text: >-
        After passing, plan [renewal](https://www.scrumalliance.org/get-certified/renewing-certifications):
        20 [SEUs](https://www.scrumalliance.org/get-certified/scrum-education-units) and $100 every 2 years.
        Earning another Scrum Alliance certification renews the ones you already hold.
