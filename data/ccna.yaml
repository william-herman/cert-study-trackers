- {title: CCNA exam page, url: 'https://www.cisco.com/site/us/en/learn/training-certifications/exams/ccna.html', note: 'price, duration'}
- {title: 'Cisco blog: get certified before the CCNA refresh', url: 'https://blogs.cisco.com/learning/stay-on-track-get-certified-before-the-ccna-refresh', note: v1.1 and v2.0 dates}
