# CCAO-F study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: ccao-f
code: CCAO-F
name: Claude Certified Associate – Foundations
issuer: Anthropic
category: ai
kind: exam
confidence: source-traced
blueprint:
  title: CCAO-F Exam Guide
  version: '1.0'
  published: July 2026
last_checked: '2026-10-01'
summary: >-
  Study plan for the CCAO-F exam: all 30 objectives across the seven weighted domains, the free prep course
  lesson for each, hands-on practice in Claude, and the scheduling, retake and renewal rules.
snapshot:
  title: Exam snapshot
  items:
  - 60 items in 120 minutes (about 135 minutes at your seat)
  - Multiple-choice and **multiple-response**; each item says how many to pick
  - Scaled 100–1,000, **720 to pass**, with percent-correct by domain on the score report
  - $99 USD, proctored by Pearson VUE online or at a test center
  - No prerequisites and no coding or API experience needed
  - Valid 12 months; on-time renewal is a **free** online assessment
lens:
  title: The lens for every question
  intro: 'From the reasoning behind the guide''s sample questions:'
  body:
  - Claude's confidence is not evidence. Specific details like citations get checked against an authoritative source before they're shared.
  - Match the model to the task. The most capable model isn't the right answer when speed and cost matter more than deep reasoning.
  - When policy restricts data, the answer is usually to make the task safe (for example, anonymize first), not to ignore the policy or abandon the work.
  prompts:
  - Does this need verification or human review before it goes anywhere?
  - Which option meets the goal at the right quality, speed and cost?
  - What's the safe way to still get the work done?
