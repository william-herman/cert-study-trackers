# PAL-I study tracker data. Schema: see SCHEMA.md. Text fields accept light Markdown:
# **bold**, *italic*, `code`, [link](https://...).
slug: pal-i
code: PAL-I
name: Professional Agile Leadership I
issuer: Scrum.org
kind: exam
confidence: field-validated
blueprint:
  title: PAL I certification page and focus areas
  version: as of Oct 2026
  published: Scrum.org
last_checked: '2026-10-01'
summary: >-
  Study plan for the PAL I assessment: the five Professional Scrum Competency focus areas it draws from,
  Scrum.org's own reading list, the 2020 Scrum Guide and 2024 EBM Guide, and practice-assessment gates.
domain_label: Focus Area
snapshot:
  title: Assessment snapshot
  items:
  - 36 questions in 60 minutes, about 1 minute 40 seconds each
  - Multiple choice, multiple answer and true/false
  - '**85% to pass**, so you can miss at most 5 questions'
  - $200 USD per attempt; the password never expires but is good for **one attempt**
  - '**Lifetime certification**, no renewal fee; free Credly badge'
  - English only (Scrum.org documents using the Google Translate plugin)
  - No question-level feedback; you get a breakdown by competency instead
lens:
  title: The lens for every question
  intro: 'From the author''s attempt:'
  body:
  - Many questions ask what a leader should do so that **the team** makes the decision.
  - Many test what the guides say against what your company actually does.
  - >-
    The Scrum Guide and EBM Guide won't fit every organization, but the assessment rewards answering by what
    they promote, not by what works where you are.
  - '**Evidence-Based Management is especially prevalent.**'
  - >-
    Scrum.org itself warns that candidates who don't lead from a servant-leadership mindset, or who won't place
    real trust in their teams, tend to struggle.
  prompts:
  - Which option helps the team make the decision, instead of making it for them?
  - Is this what the guide promotes, or what my organization does?
  - Which option creates the conditions for agility rather than controlling the work?
