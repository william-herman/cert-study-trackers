sections:
- id: s0
  'no': '0'
  title: Setup
  note: Do this first.
  groups:
  - items:
    - id: e-page
      text: >-
        Read the [PAL I certification page](https://www.scrum.org/assessments/professional-agile-leadership-certification)
        and its [Standard of Conduct](https://www.scrum.org/support/standard-conduct-assessments).
    - id: e-prep
      text: >-
        Read Scrum.org's [PAL I preparation page](https://www.scrum.org/resources/suggested-reading-professional-agile-leadership).
        Every resource below comes from it or from pages it links to.
    - id: e-course
      text: >-
        Decide on training: a live [Professional Agile Leadership Essentials](https://www.scrum.org/courses/professional-agile-leadership-essentials-training)
        class (highly recommended, not required, and includes a free attempt) or the self-paced
        [Leading Agile Teams](https://www.scrum.org/courses/self-paced/leading-agile-teams) course.
    - id: e-baseline
      text: >-
        Take the [Agile Leadership Open](https://www.scrum.org/open-assessments/agile-leadership-open) once, cold.
        Note your score and which questions surprised you; that's your baseline.
- id: s1
  'no': '1'
  title: Understanding and Applying the Scrum Framework
  short: Scrum Framework
  domain: 1
  note: Scrum.org lists Empiricism, Scrum Values, Scrum Team and Events under this focus area.
  groups:
  - title: Read
    items:
    - id: f1-guide
      text: >-
        Read the [Scrum Guide](https://www.scrum.org/resources/scrum-guide) (2020) end to end, twice. It is short;
        the exam rewards its exact wording.
    - id: f1-values-blog
      text: >-
        Read Gunther Verheyen's [blog on the Scrum Values](https://guntherverheyen.com/2013/05/03/theres-value-in-the-scrum-values/),
        the first item on Scrum.org's prep list.
    - id: f1-glossary
      text: Skim the [Scrum glossary](https://www.scrum.org/scrum-glossary) for terms you'd hesitate to define.
  - title: Concepts to own
    items:
    - id: f1-emp
      ts: '1.1'
      text: Empiricism
      sub:
      - Knowledge comes from experience and decisions based on what is observed.
      - 'Three pillars: **transparency**, **inspection**, **adaptation**. Inspection without transparency misleads; inspection without adaptation is pointless.'
      - Why Scrum fits complex work, where predictive planning breaks down.
    - id: f1-val
      ts: '1.2'
      text: Scrum Values
      sub:
      - Commitment, Focus, Openness, Respect, Courage.
      - How each value shows up in a leader's own behavior, not just the team's.
    - id: f1-team
      ts: '1.3'
      text: The Scrum Team
      sub:
      - One Scrum Team, no sub-teams or hierarchies; typically 10 or fewer people.
      - 'Accountabilities: Product Owner, Scrum Master, Developers. They are accountabilities, not job titles.'
      - Cross-functional and **self-managing**. The team decides who does what, when and how.
      - The Scrum Master serves the team, the Product Owner and the organization.
    - id: f1-events
      ts: '1.4'
      text: Events
      sub:
      - The Sprint is the container for all other events (one month or less).
      - Sprint Planning (why, what, how), Daily Scrum (15 minutes, for the Developers), Sprint Review (a working session, not a demo-only meeting), Sprint Retrospective.
      - The purpose of each event as an inspect-and-adapt opportunity, and what a leader should and shouldn't do in each.
    - id: f1-art
      text: Artifacts and their commitments
      sub:
      - Product Backlog → Product Goal; Sprint Backlog → Sprint Goal; Increment → Definition of Done.
      - Who owns each artifact, and who can change it.
  - title: Apply
    items:
    - id: f1-but
      tag: practice
      text: >-
        Read [What is ScrumBut?](https://www.scrum.org/resources/what-scrumbut) and list three ScrumButs in an
        organization you know. For each, name the Scrum Guide rule it bends and what that costs.
- id: s2
  'no': '2'
  title: Developing People and Teams
  short: People & Teams
  domain: 2
  note: Scrum.org lists Self-Managing Teams, Facilitation and Leadership Styles under this focus area.
  groups:
  - title: Read
    items:
    - id: f2-leaders
      text: >-
        Work through Scrum.org's [Resources for Agile Leaders](https://www.scrum.org/resources-agile-leaders) page,
        the second item on its prep list.
    - id: f2-styles
      text: '[Leadership Styles](https://www.scrum.org/learning-series/leadership-styles) learning series.'
    - id: f2-smt
      text: '[Self-Managing Teams](https://www.scrum.org/learning-series/self-managing-teams) learning series.'
    - id: f2-empower
      text: >-
        [Empower Scrum Teams to make decisions](https://www.scrum.org/resources/empower-scrum-teams-make-decisions)
        and [Improve cross-functionality within the Scrum Team](https://www.scrum.org/resources/improve-cross-functionality-within-scrum-team).
    - id: f2-book
      tag: optional
      text: >-
        [The Professional Agile Leader](https://www.scrum.org/resources/the-professional-agile-leader) (book).
  - title: Concepts to own
    items:
    - id: f2-1
      ts: '2.1'
      text: Self-managing teams
      sub:
      - What self-management covers (who does what, when and how) and what it doesn't (the Product Goal and priorities stay with the Product Owner).
      - A leader's job is to remove obstacles and set boundaries, not to assign tasks.
    - id: f2-2
      ts: '2.2'
      text: Facilitation
      sub:
      - Facilitation helps a group reach its own outcome; it isn't running the meeting or making the decision.
      - When a leader should step back from an event so the team can own it.
    - id: f2-3
      ts: '2.3'
      text: Leadership styles
      sub:
      - Leader vs. manager are different concepts, even when one person does both.
      - Command-and-control vs. agile leadership, which helps teams get better at deciding.
      - Agile leadership is a learned response, not a job title.
  - title: Apply
    items:
    - id: f2-decide
      tag: practice
      text: >-
        Write down five decisions you made last month. For each, could the team have made it within clear
        boundaries? What would have needed to be true?
- id: s3
  'no': '3'
  title: Managing Products with Agility
  short: Managing Products
  domain: 3
  note: Scrum.org lists Forecasting & Release Planning, Product Value, and Stakeholders & Customers under this focus area.
  groups:
  - title: Read
    items:
    - id: f3-strategy
      text: '[Business Strategy](https://www.scrum.org/learning-series/business-strategy) learning series.'
    - id: f3-outcomes
      text: '[Customer Outcomes](https://www.scrum.org/resources/customer-outcomes).'
    - id: f3-roadmaps
      text: '[Avoiding Common Mistakes with Product Roadmaps](https://www.scrum.org/resources/avoiding-common-mistakes-product-roadmaps).'
  - title: Concepts to own
    items:
    - id: f3-1
      ts: '3.1'
      text: Forecasting and release planning
      sub:
      - Forecasts are based on empirical data and change as you learn; they are not commitments.
      - A Product Backlog and its ordering, not a fixed plan, drive what gets released.
    - id: f3-2
      ts: '3.2'
      text: Product value
      sub:
      - Outcome-oriented goals (what customers experience) over activity or output goals.
      - The Product Owner is accountable for maximizing value; leaders support that, not override it.
    - id: f3-3
      ts: '3.3'
      text: Stakeholders and customers
      sub:
      - Sprint Review is where stakeholders inspect the Increment and the team adapts.
      - How a leader brings stakeholders closer to the team instead of acting as a go-between.
- id: s4
  'no': '4'
  title: Developing and Delivering Products Professionally
  short: Delivering Professionally
  domain: 4
  note: Scrum.org lists Emergent Software Development under this focus area.
  groups:
  - title: Read
    items:
    - id: f4-undone
      text: >-
        [What is un-done work and why is it harmful?](https://www.scrum.org/resources/what-un-done-work-and-why-it-harmful)
        and [Techniques for eliminating un-done work](https://www.scrum.org/resources/techniques-eliminating-un-done-work).
    - id: f4-focus
      text: >-
        [Improve the Scrum Team's ability to focus](https://www.scrum.org/resources/improve-scrum-teams-ability-focus)
        and [Navigating Impediments](https://www.scrum.org/resources/navigating-impediments).
    - id: f4-hdd
      text: '[Hypothesis-Driven Development](https://www.scrum.org/learning-series/hypothesis-driven-development) learning series.'
  - title: Concepts to own
    items:
    - id: f4-1
      ts: '4.1'
      text: Emergent software development
      sub:
      - Architecture and design emerge as the product is built and learned about; they aren't fixed up front.
      - The Definition of Done makes quality transparent; undone work hides risk and builds up as debt.
      - Pressure to "go faster" by cutting Done is a leadership anti-pattern.
- id: s5
  'no': '5'
  title: Evolving the Agile Organization
  short: Agile Organization
  domain: 5
  note: Scrum.org lists Organizational Design and Culture, and Evidence-Based Management, under this focus area.
  callout: >-
    From the author's attempt: Evidence-Based Management came up a lot. Give the EBM Guide more time than its
    single line on the reading list suggests, and answer by what it promotes.
  groups:
  - title: Read
    items:
    - id: f5-ebm
      text: >-
        Read the [Evidence-Based Management Guide](https://www.scrum.org/resources/evidence-based-management-guide)
        (2024 English version).
    - id: f5-studio
      text: '[Scrum Studio: A Model for Innovation](https://www.scrum.org/resources/scrum-studio-model-innovation) whitepaper.'
    - id: f5-ebm-book
      tag: optional
      text: >-
        [Unlocking Business Agility with Evidence-Based Management](https://www.scrum.org/resources/unlocking-business-agility-with-evidence-based-management)
        (book).
  - title: Concepts to own
    items:
    - id: f5-1
      ts: '5.1'
      text: Organizational design and culture
      sub:
      - Traditional structures (phase gates, detailed up-front plans, part-time team members) work against agility.
      - Leaders create a protected space where agile teams can work differently, and spend political capital to keep it.
      - Status and hierarchy as hidden obstacles to empowered teams.
    - id: f5-2
      ts: '5.2'
      text: Evidence-Based Management
      sub:
      - 'The four Key Value Areas: Current Value, Unrealized Value, Ability to Innovate, Time to Market.'
      - Strategic, Intermediate and Immediate Tactical Goals, and how small experiments move between them.
      - Measure outcomes and capability, not activity or utilization.
  - title: Apply
    items:
    - id: f5-kva
      tag: practice
      text: >-
        Pick one product you know. Write one measure for each Key Value Area, and say which you'd improve first and why.
- id: s6
  'no': '6'
  title: Practice and readiness
  short: Practice & readiness
  groups:
  - items:
    - id: r-alo
      text: >-
        Take the [Agile Leadership Open](https://www.scrum.org/open-assessments/agile-leadership-open) repeatedly until
        you're comfortable with the content. Its feedback is your main signal, since the real assessment gives none.
    - id: r-so
      text: Take the [Scrum Open](https://www.scrum.org/open-assessments/scrum-open) until you're comfortable with the content.
    - id: r-poo
      tag: optional
      text: >-
        [Product Owner Open](https://www.scrum.org/open-assessments/product-owner-open) if you're accountable for
        product value; [Scrum Developer Open](https://www.scrum.org/open-assessments/scrum-developer-open) if you're
        a developer.
    - id: r-why
      tag: practice
      text: >-
        For every Open question you miss, write why the right answer is right *using the Scrum Guide or EBM Guide
        wording*, not intuition.
    - id: r-forum
      tag: optional
      text: Read [Scrum.org Forum](https://www.scrum.org/forum) threads on agile leadership to see how practitioners reason through edge cases.
    - id: r-gate
      text: >-
        **Booking gate:** every coverage item below ticked, and you can explain each Scrum event, accountability and
        EBM Key Value Area without notes.
- id: s7
  'no': '7'
  title: Assessment day
  groups:
  - items:
    - id: l-buy
      text: Buy the attempt and keep the password safe. It has no expiry and works once.
    - id: l-env
      text: >-
        Block 60 uninterrupted minutes on a reliable connection. If you'll use Google Translate, follow
        [Scrum.org's instructions](https://www.scrum.org/support/using-google-translate-chrome-take-assessments) exactly.
    - id: l-pace
      text: Pace at roughly 15 questions per 25 minutes, leaving time to revisit flagged questions.
    - id: l-after
      text: >-
        Afterwards, use the competency breakdown to see where you were weakest, even if you passed. Scrum.org
        won't share which questions you got wrong.
