<style>
/* Layout: sticky progress header, domain meters strip, then a two-column workbench (section index | checklist) that stacks on phones. */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --fg: #16201d;
  --muted: #5b6863;
  --line: #d6dddb;
  --accent: #1f6b57;
  --accent-soft: #d8ebe4;
  --accent-fg: #ffffff;
  --amber: #a5620a;
  --amber-soft: #f6e7cf;
  --ex: #3d4fa3;
  --ex-soft: #e2e6f6;
  --done-fg: #8a9692;
  --focus: #1f6b57;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --surface-2: #1d2623; --fg: #e4ebe8; --muted: #95a39e;
    --line: #2b3632; --accent: #5cc09f; --accent-soft: #1c3a31; --accent-fg: #0b1512;
    --amber: #e3a54d; --amber-soft: #3a2c16; --ex: #9fb0f5; --ex-soft: #232a4a; --done-fg: #66736e; --focus: #5cc09f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --surface-2: #1d2623; --fg: #e4ebe8; --muted: #95a39e;
  --line: #2b3632; --accent: #5cc09f; --accent-soft: #1c3a31; --accent-fg: #0b1512;
  --amber: #e3a54d; --amber-soft: #3a2c16; --ex: #9fb0f5; --ex-soft: #232a4a; --done-fg: #66736e; --focus: #5cc09f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; word-break: break-word; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.15; margin: 0; text-wrap: balance; }
.overall { flex: 1 1 260px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.overall .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.save { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save[data-state="local"] { color: var(--amber); }

/* Domain meters */
.meters { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: 10px; padding-block: 18px 6px; }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.meter:hover { border-color: var(--accent); }
.meter .w { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1; }
.meter .w small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.meter .n { font-size: 13px; line-height: 1.3; min-height: 2.6em; }
.meter .bar { height: 5px; }
.meter .c { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 860px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } .meter.d1 { grid-column: span 2; } }

/* Workbench */
.bench { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; padding-block: 18px 60px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } .index { position: static !important; } }
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 14px; }
.index nav { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 860px) { .index nav { flex-direction: row; flex-wrap: wrap; gap: 6px; } .index nav a { border: 1px solid var(--line); } }
.index nav a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px; }
.index nav a:hover { background: var(--surface); }
.index nav a .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.index nav a.full .k { color: var(--accent); }
.filters { display: flex; flex-direction: column; gap: 8px; }
.filters .lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.reset { font: inherit; font-size: 13px; background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; align-self: flex-start; }
.reset:hover { color: var(--fg); border-color: var(--muted); }
.confirm { font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.confirm button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.confirm .danger { background: var(--amber); color: var(--surface); border-color: var(--amber); }

/* Sections */
.content { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 700px) { .intro { grid-template-columns: minmax(0, 1fr); } }
.intro h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.intro ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.intro p { margin: 0 0 6px; font-size: 14px; }
.lens q { display: block; font-family: var(--f-display); font-size: 15px; font-weight: 500; quotes: none; padding-left: 12px; border-left: 3px solid var(--accent); margin-top: 6px; }

section.sec { scroll-margin-top: 96px; }
.sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; border-bottom: 2px solid var(--fg); padding-bottom: 8px; margin-bottom: 4px; }
.sec-head .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.sec-head h2 { font-family: var(--f-display); font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; text-wrap: balance; }
.sec-head .wt { font-family: var(--f-mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 99px; }
.sec-head .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-note { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.callout { background: var(--amber-soft); color: var(--fg); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }

.group { margin-top: 16px; }
.group h4 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border: 1.5px solid var(--muted); border-radius: 5px; display: grid; place-content: center; cursor: pointer; background: var(--surface); }
.item input::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--accent-fg); border-bottom: 2px solid var(--accent-fg); transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.item input:checked { background: var(--accent); border-color: var(--accent); }
.item input:checked::after { opacity: 1; }
.item label { cursor: pointer; min-width: 0; }
.item .t { display: block; }
.item.done .t { color: var(--done-fg); text-decoration: line-through; text-decoration-color: var(--line); }
.item.done .sub, .item.done .when { color: var(--done-fg); }
.item .sub { margin: 5px 0 0; padding-left: 16px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.item .when { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; line-height: 18px; }
.tag.ex { background: var(--ex-soft); color: var(--ex); }
.tag.added { background: var(--amber-soft); color: var(--amber); }
.tag.ts { background: var(--accent-soft); color: var(--accent); }
.tag.opt { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.hidden-note { font-size: 13px; color: var(--muted); padding: 10px 14px; }

.skip { margin-top: 12px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 16px; font-size: 14px; }
.skip h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.skip ul { margin: 0; padding-left: 18px; color: var(--muted); }
.oos { columns: 2 220px; column-gap: 24px; margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }

.cov { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.cov .item { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 12px; }
.cov .item .t { font-size: 14px; }
.cov .where { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

.res { display: flex; flex-direction: column; gap: 6px; font-size: 14px; padding-left: 18px; margin: 10px 0 0; }
footer { color: var(--muted); font-size: 12px; padding-block: 0 40px; }

@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }

/* ---- Additions for the shared template ---- */
body { margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); padding-top: 16px; }
.tier { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; text-decoration: none; }
.tier::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tier.field-validated { color: var(--accent); background: var(--accent-soft); }
.tier.source-traced { color: var(--amber); background: var(--amber-soft); }
.tier.peer-reviewed { color: var(--ex); background: var(--ex-soft); }
.meta .sep { color: var(--line); }
.stale { background: var(--amber-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-top: 12px; }
.tier-note { font-size: 14px; color: var(--muted); margin: 8px 0 0; max-width: 72ch; }
.site-foot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.site-foot p { margin: 0; }
.meters:empty { display: none; }
.intro.single { grid-template-columns: minmax(0, 1fr); }

/* Index page */
.hero { padding-block: 40px 8px; max-width: 760px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(28px, 6vw, 44px); line-height: 1.05; margin: 0 0 12px; text-wrap: balance; }
.hero p { color: var(--muted); font-size: 16px; margin: 0 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding-block: 20px 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; color: inherit; text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card .code { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.card h2 { font-family: var(--f-display); font-size: 20px; margin: 0; line-height: 1.2; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
.card .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; font-size: 12px; color: var(--muted); }
.tiers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 0 0 32px; padding: 0; list-style: none; }
.tiers li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.section-h { font-family: var(--f-display); font-size: 20px; margin: 8px 0 10px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
@media (max-width: 600px) { .meta .sep { display: none; } .meta { flex-direction: column; align-items: flex-start; } }
.meter .w { overflow-wrap: anywhere; }

/* Spacing between headings and checklist items */
.sec-head { margin-bottom: 12px; }
.sec-note { margin-top: 10px; }
.group { margin-top: 24px; }
.group h4 { margin-bottom: 10px; }
.cov { margin-top: 16px; }
#sections section.sec + section.sec { margin-top: 48px; }
.lens ul { margin: 0 0 10px; }
.lens ul li { margin: 0; }
.meter .w.lbl { font-size: 18px; line-height: 1.15; }

</style>
</head>

  </div>
</div>

const CERT = {"slug": "ccar-f", "code": "CCAR-F", "name": "Claude Certified Architect – Foundations", "issuer": "Anthropic", "kind": "exam", "confidence": "source-traced", "blueprint": {"title": "CCAR-F Exam Guide", "version": "1.0", "published": "2026-07"}, "last_checked": "2026-10-01", "summary": "Hands-on study plan for the CCAR-F exam: the five weighted domains, every official exercise, extra builds for thinly covered task statements, and readiness gates.", "snapshot": {"title": "Exam snapshot", "items": ["60 items in 120 min (about 135 min seat time)", "Multiple-choice and **multiple-response**; each item says how many to pick", "4 scenarios drawn from a bank of 6", "Scaled 100–1,000, **720 to pass**, with percent-correct by domain", "$125, proctored by Pearson VUE, closed book", "Valid 12 months; renewal is a free online assessment"]}, "lens": {"title": "The lens for every question", "body": ["Each item asks for the root cause and the proportionate fix.", "Wrong answers over-engineer (classifiers, routing layers, bigger models, voting) or use a prompt where a guarantee is needed."], "prompts": ["What's the smallest change that fixes the actual failure?", "Does this need a guarantee (code) or guidance (prompt)?"]}, "domains": [{"id": 1, "name": "Agentic Architecture & Orchestration", "short": "Agentic Architecture & Orchestration", "weight": 27}, {"id": 2, "name": "Tool Design & MCP Integration", "short": "Tool Design & MCP", "weight": 18}, {"id": 3, "name": "Claude Code Configuration & Workflows", "short": "Claude Code Config & Workflows", "weight": 20}, {"id": 4, "name": "Prompt Engineering & Structured Output", "short": "Prompt Eng. & Structured Output", "weight": 20}, {"id": 5, "name": "Context Management & Reliability", "short": "Context Mgmt & Reliability", "weight": 15}], "tag_legend": [{"tag": "Ex1–Ex4", "style": "ex", "meaning": "official exercise steps"}, {"tag": "added", "style": "added", "meaning": "extra builds covering task statements the exercises touch lightly"}, {"tag": "optional", "style": "optional", "meaning": "not counted toward progress"}], "sections": [{"id": "s0", "no": "0", "title": "Eligibility & setup", "note": "Do this first.", "groups": [{"items": [{"id": "e-guide", "text": "Read the full [Exam Guide v1.0 (PDF)](https://everpath-course-content.s3-accelerate.amazonaws.com/instructor%2F6nizmqk8tpzpfjvt6qmmav7rh%2Fpublic%2F1783542750%2FClaude+Certified+Architect+%E2%80%93+Foundations+Exam+Guide.pdf) cover to cover. The March 2026 version circulating online is superseded."}, {"id": "e-env", "text": "Environment ready", "sub": ["Python or TypeScript", "Claude API key", "Claude Code installed", "Claude Agent SDK installed", "Pydantic or a JSON Schema validator"]}, {"id": "e-github", "text": "Take GitHub's free [Introduction to GitHub](https://github.com/skills/introduction-to-github) course (under an hour). It covers repositories, branches, commits and pull requests, which is what you need to set up and work in the study repo."}, {"id": "e-repo", "text": "Create the study repo (e.g. `ccarf-lab/`) that every build goes into."}]}]}, {"id": "s1", "no": "1", "title": "Free Anthropic courses", "note": "Take each one just before the build section it supports, not all up front.", "groups": [{"title": "Core", "items": [{"id": "c-api", "text": "[Building with the Claude API](https://anthropic.skilljar.com/claude-with-the-anthropic-api): tool use, tool_choice, structured output, agentic loops, batches. *Before Section 2 and Section 5.*"}, {"id": "c-mcp", "text": "[Introduction to Model Context Protocol](https://anthropic.skilljar.com/introduction-to-model-context-protocol): tools vs. resources vs. prompts. *Before Section 3.*"}, {"id": "c-cc", "text": "[Claude Code in Action](https://anthropic.skilljar.com/claude-code-in-action): configuration, hooks, automation, headless/CI. *Before Section 4.*"}, {"id": "c-skills", "text": "[Introduction to Agent Skills](https://anthropic.skilljar.com/introduction-to-agent-skills): SKILL.md and frontmatter (3.2). *Before Section 4.*"}, {"id": "c-sub", "text": "[Introduction to Subagents](https://anthropic.skilljar.com/introduction-to-subagents): context isolation and delegation (1.3, 3.4, 5.4). *Before Section 2 and Section 4.*"}]}, {"title": "Optional, only if a gap shows up", "items": [{"id": "c-p101", "text": "[Claude Platform 101](https://anthropic.skilljar.com/claude-platform-101): API fundamentals refresher.", "tag": "optional"}, {"id": "c-cc101", "text": "[Claude Code 101](https://anthropic.skilljar.com/claude-code-101): daily Claude Code workflow refresher.", "tag": "optional"}]}], "skip": ["Claude with Amazon Bedrock / Claude on Google Cloud: on the official prep list, but cloud-provider configuration is out of scope.", "Model Context Protocol: Advanced Topics: sampling, notifications and transports are mostly server hosting, which is out of scope.", "Claude 101 / AI Fluency: on the official list but well below this exam's level for anyone ready to sit it."]}, {"id": "s2", "no": "2", "title": "Agentic Architecture & Orchestration", "domain": 1, "note": "The highest-weighted domain.", "groups": [{"title": "Concepts to own", "items": [{"id": "d1-1", "text": "Agentic loop", "ts": "1.1", "sub": ["Continue on `stop_reason: \"tool_use\"`, stop on `\"end_turn\"`; append tool results to history.", "Anti-patterns: parsing text to decide when to stop, iteration caps as the primary stop, assistant text as the completion signal.", "Model-driven tool choice vs. pre-scripted decision trees."]}, {"id": "d1-2", "text": "Hub-and-spoke orchestration", "ts": "1.2", "sub": ["Coordinator routes *all* inter-agent communication.", "Select subagents dynamically instead of always running the full pipeline.", "Partition scope to avoid duplicate work; watch for overly narrow decomposition.", "**Iterative refinement:** evaluate synthesis for gaps → re-delegate targeted queries → re-synthesize."]}, {"id": "d1-3", "text": "Subagent spawning and context passing", "ts": "1.3", "sub": ["`Task` tool, with `\"Task\"` required in `allowedTools`.", "`AgentDefinition`: description, system prompt, tool restrictions.", "Subagents inherit *nothing*; pass findings explicitly in the prompt.", "Parallel = multiple `Task` calls in **one** response.", "Coordinator prompts give goals and quality criteria, not step-by-step procedures."]}, {"id": "d1-4", "text": "Programmatic enforcement vs. prompt guidance", "ts": "1.4", "sub": ["Prompts have a non-zero failure rate.", "Prerequisite gates, e.g. block `process_refund` until `get_customer` returns a verified ID.", "Structured handoffs for humans who can't see the transcript: customer ID, root cause, amount, recommended action."]}, {"id": "d1-5", "text": "Hooks", "ts": "1.5", "sub": ["`PostToolUse` to normalize data (Unix timestamps, ISO 8601, status codes).", "Tool-call interception to block policy violations (e.g. refund > $500) and redirect to escalation."]}, {"id": "d1-6", "text": "Decomposition: prompt chaining for predictable multi-aspect work vs. dynamic decomposition for open-ended investigation (map → prioritize → adapt).", "ts": "1.6"}, {"id": "d1-7", "text": "Sessions", "ts": "1.7", "sub": ["`--resume <name>` and `fork_session`.", "Tell a resumed session which files changed.", "Prefer a fresh session plus an injected summary when prior tool results are stale."]}]}, {"title": "Build · Exercise 1: multi-tool agent with escalation", "items": [{"id": "b1-tools", "text": "Define 3–4 tools with detailed descriptions, including **two deliberately similar tools** that need careful wording to keep apart.", "tag": "Ex1"}, {"id": "b1-loop", "text": "Implement the agentic loop handling both `tool_use` and `end_turn` correctly.", "tag": "Ex1"}, {"id": "b1-err", "text": "Add structured errors (`errorCategory`, `isRetryable`, readable message). Confirm transient errors are retried and business errors explained to the user.", "tag": "Ex1"}, {"id": "b1-hook", "text": "Add a hook that intercepts tool calls to enforce a threshold rule and redirects to escalation.", "tag": "Ex1"}, {"id": "b1-multi", "text": "Test multi-concern messages: the agent decomposes them, handles each concern, and synthesizes one response.", "tag": "Ex1"}, {"id": "b1-norm", "text": "Add a `PostToolUse` hook that normalizes mixed date and status formats from two tools.", "tag": "added"}, {"id": "b1-match", "text": "Have a tool return **multiple customer matches**; confirm the agent asks for another identifier instead of guessing (5.2).", "tag": "added"}, {"id": "b1-handoff", "text": "On escalation, emit a structured handoff summary object.", "tag": "added"}]}, {"title": "Build · Exercise 4, part 1: multi-agent research pipeline", "items": [{"id": "b4-coord", "text": "Coordinator with ≥2 subagents (web search, doc analysis). `allowedTools` includes `\"Task\"`; findings passed explicitly in subagent prompts.", "tag": "Ex4"}, {"id": "b4-par", "text": "Parallel execution via multiple `Task` calls in one response. Measure latency vs. sequential.", "tag": "Ex4"}, {"id": "b4-gap", "text": "Give the coordinator a gap-check step that re-delegates targeted queries before final synthesis (1.2).", "tag": "added"}, {"id": "b4-sess", "text": "Run a named session, change a file, resume while saying what changed, then `fork_session` to compare two approaches (1.7).", "tag": "added"}]}, {"title": "Self-check", "items": [{"id": "d1-sc1", "text": "Explain out loud why a prompt can't *guarantee* verify-before-refund, and what does."}, {"id": "d1-sc2", "text": "Explain why “the report only covers visual arts” is a coordinator decomposition problem, not a search problem."}]}]}, {"id": "s3", "no": "3", "title": "Tool Design & MCP Integration", "domain": 2, "groups": [{"title": "Concepts to own", "items": [{"id": "d2-1", "text": "Tool descriptions are the *primary* selection mechanism", "ts": "2.1", "sub": ["Include input formats, example queries, edge cases, when to use vs. alternatives.", "Rename or split overlapping tools.", "Watch for system-prompt keywords that override good descriptions."]}, {"id": "d2-2", "text": "MCP `isError` and error categories (transient / validation / business / permission)", "ts": "2.2", "sub": ["Generic “Operation failed” blocks recovery.", "Business errors carry `isRetryable: false` plus customer-friendly text.", "**Access failure ≠ valid empty result.**"]}, {"id": "d2-3", "text": "Tool distribution and `tool_choice`", "ts": "2.3", "sub": ["4–5 scoped tools per agent, not 18.", "Cross-role tools only for high-frequency needs (e.g. `verify_fact`).", "Constrained tools beat generic ones (`load_document` vs. `fetch_url`).", "`\"auto\"` / `\"any\"` / forced `{\"type\":\"tool\",\"name\":…}`."]}, {"id": "d2-4", "text": "MCP configuration", "ts": "2.4", "sub": ["`.mcp.json` = project, shared; `~/.claude.json` = user, personal.", "`${ENV_VAR}` expansion for secrets.", "All servers' tools are discovered at connection time.", "**Prefer community servers for standard integrations (e.g. Jira);** custom only for team-specific workflows.", "**Resources** = content catalogs; **tools** = actions."]}, {"id": "d2-5", "text": "Built-in tools", "ts": "2.5", "sub": ["Grep = content search; Glob = path patterns.", "Edit needs a unique anchor; fall back to Read + Write.", "Explore incrementally (Grep entry points → Read imports), not everything up front."]}]}, {"title": "Build", "items": [{"id": "b2-desc", "text": "With the Ex1 similar-tool pair: keep descriptions minimal, log misroutes, then fix by **rewriting descriptions only**. No routing layer.", "tag": "added"}, {"id": "b2-split", "text": "Split a generic tool into purpose-specific ones (`analyze_document` → `extract_data_points` / `summarize_content` / `verify_claim_against_source`).", "tag": "added"}, {"id": "b2-res", "text": "Expose a small content catalog as an **MCP resource**; observe fewer exploratory tool calls.", "tag": "added"}, {"id": "b2-grep", "text": "Write an MCP tool description strong enough that Claude prefers it over built-in Grep for its task.", "tag": "added"}, {"id": "b2-trace", "text": "In Claude Code on a real repo: trace a function's callers through wrapper modules (Grep → Read), force an Edit non-unique failure, recover with Read + Write.", "tag": "added"}]}]}, {"id": "s4", "no": "4", "title": "Claude Code Configuration & Workflows", "domain": 3, "groups": [{"title": "Concepts to own", "items": [{"id": "d3-1", "text": "CLAUDE.md hierarchy", "ts": "3.1", "sub": ["User (`~/.claude/CLAUDE.md`, not shared), project (`.claude/CLAUDE.md` or root), directory-level.", "`@import` for modular files; `.claude/rules/` to split a monolith.", "`/memory` to see what's actually loaded."]}, {"id": "d3-2", "text": "Commands and skills", "ts": "3.2", "sub": ["`.claude/commands/` (shared) vs. `~/.claude/commands/` (personal).", "`SKILL.md` frontmatter: `context: fork`, `allowed-tools`, `argument-hint`.", "Personal skill variants under different names.", "Skills = on demand; CLAUDE.md = always loaded."]}, {"id": "d3-3", "text": "Path-scoped rules: `paths:` glob frontmatter applies regardless of directory (e.g. `**/*.test.tsx`) and beats subdirectory CLAUDE.md for conventions spread across the codebase.", "ts": "3.3"}, {"id": "d3-4", "text": "Plan mode vs. direct execution", "ts": "3.4", "sub": ["Plan mode: architectural, multi-file, multiple valid approaches.", "Direct: well-scoped, single-file changes.", "Plan-then-execute combos; Explore subagent isolates verbose discovery."]}, {"id": "d3-5", "text": "Iterative refinement", "ts": "3.5", "sub": ["2–3 concrete input/output examples.", "Test-first iteration.", "The interview pattern.", "Interacting issues in one message; independent issues sequentially."]}, {"id": "d3-6", "text": "CI/CD", "ts": "3.6", "sub": ["`-p` / `--print` (no interactive hang).", "`--output-format json` + `--json-schema`.", "CLAUDE.md supplies CI context (test standards, fixtures).", "Independent review instance, not self-review.", "Feed prior findings back so only new or unaddressed issues are reported; pass existing tests to avoid duplicates."]}]}, {"title": "Build · Exercise 2: team Claude Code setup", "items": [{"id": "b3-md", "text": "Project-level CLAUDE.md with coding and testing standards; verify it applies consistently.", "tag": "Ex2"}, {"id": "b3-rules", "text": "`.claude/rules/` files with globs (`src/api/**/*`, `**/*.test.*`); verify each loads **only** for matching files.", "tag": "Ex2"}, {"id": "b3-skill", "text": "Project skill in `.claude/skills/` with `context: fork` and restricted `allowed-tools`; verify the main context stays clean.", "tag": "Ex2"}, {"id": "b3-mcp", "text": "`.mcp.json` server with `${ENV_VAR}` credentials plus a personal server in `~/.claude.json`; verify both are available at once.", "tag": "Ex2"}, {"id": "b3-plan", "text": "Plan mode vs. direct on three tasks: single-file bug fix, multi-file library migration, new feature with multiple valid approaches. Note where plan mode earned its keep.", "tag": "Ex2"}, {"id": "b3-import", "text": "Use `@import` to pull a standards file into a package-level CLAUDE.md; check with `/memory`.", "tag": "added"}, {"id": "b3-user", "text": "Put an instruction in user-level CLAUDE.md, confirm a “teammate” doesn't get it, then move it to project level.", "tag": "added"}, {"id": "b3-cmd", "text": "Create a project slash command in `.claude/commands/` and a skill using `argument-hint`.", "tag": "added"}]}, {"title": "Build · CI / headless", "items": [{"id": "b3-ci1", "text": "Script `claude -p \"…\" --output-format json --json-schema <schema>` that reviews a diff and outputs machine-parseable findings.", "tag": "added"}, {"id": "b3-ci2", "text": "Re-run after a new commit with prior findings in context; confirm no duplicate comments.", "tag": "added"}, {"id": "b3-ci3", "text": "Generate tests with existing tests in context; confirm no duplicated scenarios.", "tag": "added"}]}, {"title": "Self-check", "items": [{"id": "d3-sc", "text": "Classify 10 of your own tasks from your day-to-day work as plan mode or direct execution, with a one-line reason each."}]}]}, {"id": "s5", "no": "5", "title": "Prompt Engineering & Structured Output", "domain": 4, "groups": [{"title": "Concepts to own", "items": [{"id": "d4-1", "text": "Explicit categorical criteria beat “be conservative”", "ts": "4.1", "sub": ["False positives erode trust in accurate categories too.", "Temporarily disable noisy categories.", "Define severity levels with code examples."]}, {"id": "d4-2", "text": "Few-shot prompting", "ts": "4.2", "sub": ["2–4 examples targeting **ambiguous** cases, with reasoning for the choice.", "Format consistency and generalization.", "Reduce extraction hallucination across varied layouts."]}, {"id": "d4-3", "text": "`tool_use` + JSON schema", "ts": "4.3", "sub": ["Eliminates *syntax* errors, not *semantic* ones.", "`\"any\"` when doc type is unknown; forced tool to run a step first.", "Nullable/optional fields prevent fabrication.", "`\"unclear\"` and `\"other\"` + detail enums; normalization rules in the prompt."]}, {"id": "d4-4", "text": "Validation-retry loops", "ts": "4.4", "sub": ["Send back document + failed extraction + specific error.", "Retry fixes format/structure, **not** information missing from the source.", "`detected_pattern` for false-positive analysis.", "`calculated_total` vs. `stated_total` plus `conflict_detected`."]}, {"id": "d4-5", "text": "Message Batches API", "ts": "4.5", "sub": ["50% cheaper, up to 24h, **no SLA**, no mid-request multi-turn tools, `custom_id` correlation.", "Non-blocking jobs only.", "Submission cadence vs. SLA (every 4h → 30h guarantee).", "Resubmit only failed `custom_id`s; refine the prompt on a sample first."]}, {"id": "d4-6", "text": "Review architecture", "ts": "4.6", "sub": ["Self-review is weak: the model keeps its own reasoning.", "An independent instance catches more.", "Per-file passes + a cross-file integration pass.", "Per-finding confidence to route review effort."]}]}, {"title": "Build · Exercise 3: structured extraction pipeline", "items": [{"id": "b5-schema", "text": "Extraction schema with required, optional and nullable fields plus an `\"other\"` + detail enum. Feed docs with missing fields; verify **null, not fabricated values**.", "tag": "Ex3"}, {"id": "b5-retry", "text": "Validation-retry loop (Pydantic or JSON Schema). Log which errors retry fixes vs. which it can't.", "tag": "Ex3"}, {"id": "b5-few", "text": "Few-shot examples across varied formats (inline citations vs. bibliography, narrative vs. table); compare before and after.", "tag": "Ex3"}, {"id": "b5-batch", "text": "Batch ~100 docs via Message Batches API; handle failures by `custom_id`, resubmit with fixes (chunk oversized docs), compute total time vs. an SLA.", "tag": "Ex3"}, {"id": "b5-conf", "text": "Field-level confidence → route low-confidence to human review → analyze accuracy **by doc type and field**.", "tag": "Ex3"}, {"id": "b5-totals", "text": "Add `calculated_total` / `stated_total` / `conflict_detected` to an invoice-style schema.", "tag": "added"}, {"id": "b5-choice", "text": "Forced `tool_choice` so `extract_metadata` runs before enrichment; `\"any\"` when doc type is unknown.", "tag": "added"}]}, {"title": "Build · Review quality", "items": [{"id": "b5-crit", "text": "Rewrite a noisy review prompt (“check comments are accurate”) with explicit report/skip criteria and 2–3 few-shot examples; compare false positives.", "tag": "added"}, {"id": "b5-pass", "text": "Single-pass review of a 10+ file diff vs. per-file passes plus an integration pass; note inconsistencies.", "tag": "added"}, {"id": "b5-self", "text": "Same-session self-review vs. a fresh instance reviewing the same code; compare what each catches.", "tag": "added"}]}]}, {"id": "s6", "no": "6", "title": "Context Management & Reliability", "domain": 5, "groups": [{"title": "Concepts to own", "items": [{"id": "d5-1", "text": "Long context", "ts": "5.1", "sub": ["Summarization loses numbers, dates, commitments: keep a persistent **case-facts block**.", "Lost-in-the-middle: key summaries first, section headers.", "**Trim verbose tool outputs** to relevant fields.", "Upstream agents return structured data, not reasoning chains; pass complete history each request."]}, {"id": "d5-2", "text": "Escalation", "ts": "5.2", "sub": ["Triggers: explicit human request (honor immediately), policy gap or silence, inability to progress.", "**Not** sentiment or self-rated confidence.", "Acknowledge frustration but offer to resolve; escalate if they reiterate.", "Multiple matches → ask for an identifier."]}, {"id": "d5-3", "text": "Error propagation", "ts": "5.3", "sub": ["Structured context: failure type, attempt, partial results, alternatives.", "Local recovery for transient errors.", "Anti-patterns: silent “success” with empty results, killing the whole workflow on one failure.", "Coverage annotations in the output."]}, {"id": "d5-4", "text": "Large codebase exploration", "ts": "5.4", "sub": ["Context degradation in long sessions.", "Scratchpad files; subagent delegation.", "Summarize each phase before spawning the next.", "Manifest-based crash recovery; `/compact`."]}, {"id": "d5-5", "text": "Human review", "ts": "5.5", "sub": ["A 97% aggregate can hide bad segments.", "Stratified sampling of high-confidence outputs.", "Field-level confidence calibrated on labeled sets.", "Validate by doc type and field before cutting review."]}, {"id": "d5-6", "text": "Provenance", "ts": "5.6", "sub": ["Claim → source mappings preserved through synthesis.", "Annotate conflicts instead of picking one value; dates prevent false contradictions.", "Separate well-established from contested findings.", "Render by content type: tables for financials, prose for news, lists for technical findings."]}]}, {"title": "Build · Exercise 4, part 2", "items": [{"id": "b6-struct", "text": "Subagent output: claim, evidence excerpt, source URL/doc, publication date. Verify synthesis preserves attribution.", "tag": "Ex4"}, {"id": "b6-timeout", "text": "Simulate a subagent timeout: coordinator gets structured error context, proceeds with partial results, annotates coverage gaps.", "tag": "Ex4"}, {"id": "b6-conflict", "text": "Feed two credible sources with conflicting statistics: keep both with attribution, separate established from contested.", "tag": "Ex4"}, {"id": "b6-empty", "text": "Distinguish “search failed” from “zero results” in the error payload.", "tag": "added"}, {"id": "b6-manifest", "text": "Each subagent writes state to a known location; kill and resume so the coordinator restores from a manifest.", "tag": "added"}]}, {"title": "Build · Context hygiene", "items": [{"id": "b6-facts", "text": "In a long multi-issue support conversation (reuse Ex1), keep a case-facts block outside summarized history; confirm facts survive summarization.", "tag": "added"}, {"id": "b6-trim", "text": "Trim an order-lookup result from ~40 fields to the ~5 relevant ones before it enters context.", "tag": "added"}, {"id": "b6-scratch", "text": "In Claude Code on a large repo: scratchpad file for findings, delegate “find all X” to subagents, `/compact` when context fills.", "tag": "added"}]}]}, {"id": "s7", "no": "7", "title": "Drills & readiness gates", "callout": "There is no official practice exam. It was retired in the June 2026 move to Pearson. These gates replace it.", "groups": [{"items": [{"id": "r-sample", "text": "**Sample questions:** work the guide's 12 samples and write *why every wrong option is wrong* (over-engineered, wrong layer, probabilistic where deterministic is needed, different problem)."}, {"id": "r-drills", "text": "**Self-authored drills:** for each of the 6 scenarios, write 3 exam-style questions, at least one **multi-select**. Source the failure modes from your build logs."}, {"id": "r-teach", "text": "**Teach-back:** explain each of the 30 task statements (coverage grid below) in 2–3 sentences without notes. Redo the build for any you can't."}, {"id": "r-mock", "text": "Third-party mock exams (Tutorials Dojo, claudecertificationguide.com). Not verified by Anthropic; the guide wins any conflict. Target ≥80% before booking.", "tag": "optional"}, {"id": "r-gate", "text": "**Booking gate:** every task statement ticked, sample-question reasoning comes easily, every exercise step done."}]}]}, {"id": "s8", "no": "8", "title": "Exam logistics", "groups": [{"items": [{"id": "l-reg", "text": "Register and pay in the Partner Academy, then schedule with Pearson VUE (online or test center). Registration is valid 5 years."}, {"id": "l-name", "text": "Pearson profile name matches your government ID **exactly**.", "sub": ["Mismatch: email certifications-support@anthropic.com, subject “Name Correction Request”, at least 24h ahead (corrections take 24–48 business hours).", "A mismatch at check-in forfeits the fee."]}, {"id": "l-resched", "text": "Know the cutoff: **reschedule or cancel at least 48 hours ahead** (FAQ says 48h, guide says 24h; use the stricter). Cancelling in Pearson doesn't refund; email support for that."}, {"id": "l-online", "text": "Online proctoring ready", "sub": ["Run Pearson's system test.", "Check your work network or managed device isn't blocking it; use a test center if so.", "Clear desk: no phone, watch, second monitor, notes or translation tools."]}, {"id": "l-retake", "text": "Know the retake rules", "sub": ["Full fee each attempt.", "Waits of 14 / 30 / 90 days after the 1st / 2nd / 3rd failure.", "Maximum 4 attempts per rolling 12 months.", "Use the per-domain score report to target review."]}, {"id": "l-final", "text": "Final pass: re-read the guide's In-Scope list, Technologies appendix and the out-of-scope list below. No new material."}]}], "out_of_scope": ["Fine-tuning or training", "API auth, billing, account management, OAuth, key rotation", "Language/framework specifics beyond tool and schema config", "Deploying or hosting MCP servers", "Model internals, Constitutional AI, RLHF", "Embeddings and vector databases", "Computer use", "Vision", "Streaming and server-sent events", "Rate limits, quotas, pricing math", "Cloud provider configs (AWS, GCP, Azure)", "Benchmarks and model comparisons", "Prompt caching internals", "Tokenization"]}], "objectives": {"title": "Task statement coverage", "note": "Tick one only when you have built it and can teach it back without notes.", "items": [{"id": "1.1", "name": "Agentic loops (stop_reason control flow)", "where": "Section 2 Ex1"}, {"id": "1.2", "name": "Coordinator–subagent orchestration, iterative refinement", "where": "Section 2 Ex4"}, {"id": "1.3", "name": "Subagent invocation, context passing, parallel Task calls", "where": "Section 2 Ex4"}, {"id": "1.4", "name": "Programmatic enforcement & structured handoffs", "where": "Section 2 Ex1"}, {"id": "1.5", "name": "Hooks: PostToolUse normalization, call interception", "where": "Section 2 Ex1"}, {"id": "1.6", "name": "Decomposition: chaining vs. dynamic", "where": "Section 2, Section 5 multi-pass"}, {"id": "1.7", "name": "Session resume / fork / fresh-with-summary", "where": "Section 2 added"}, {"id": "2.1", "name": "Tool descriptions & boundaries", "where": "Section 3"}, {"id": "2.2", "name": "Structured MCP errors (isError, categories, retryable)", "where": "Section 2 Ex1, Section 3"}, {"id": "2.3", "name": "Tool distribution & tool_choice", "where": "Section 3, Section 5"}, {"id": "2.4", "name": "MCP servers in Claude Code (scopes, env vars, resources)", "where": "Section 3, Section 4 Ex2"}, {"id": "2.5", "name": "Built-in tools (Grep/Glob/Read/Write/Edit/Bash)", "where": "Section 3"}, {"id": "3.1", "name": "CLAUDE.md hierarchy, @import, /memory", "where": "Section 4 Ex2"}, {"id": "3.2", "name": "Slash commands & skills (frontmatter)", "where": "Section 4 Ex2"}, {"id": "3.3", "name": "Path-specific rules with globs", "where": "Section 4 Ex2"}, {"id": "3.4", "name": "Plan mode vs. direct execution, Explore subagent", "where": "Section 4 Ex2"}, {"id": "3.5", "name": "Iterative refinement techniques", "where": "Section 4 self-check, Section 5"}, {"id": "3.6", "name": "CI/CD integration (-p, JSON schema, no duplicates)", "where": "Section 4 CI"}, {"id": "4.1", "name": "Explicit criteria to cut false positives", "where": "Section 5 review"}, {"id": "4.2", "name": "Few-shot for ambiguous cases", "where": "Section 5 Ex3, review"}, {"id": "4.3", "name": "tool_use + JSON schema structured output", "where": "Section 5 Ex3"}, {"id": "4.4", "name": "Validation-retry & feedback loops", "where": "Section 5 Ex3"}, {"id": "4.5", "name": "Batch processing strategy", "where": "Section 5 Ex3"}, {"id": "4.6", "name": "Multi-instance / multi-pass review", "where": "Section 5 review"}, {"id": "5.1", "name": "Preserving critical info in long context", "where": "Section 6 hygiene"}, {"id": "5.2", "name": "Escalation & ambiguity resolution", "where": "Section 2 Ex1, Section 6"}, {"id": "5.3", "name": "Error propagation across agents", "where": "Section 6 Ex4"}, {"id": "5.4", "name": "Context in large codebase exploration", "where": "Section 6 hygiene, Ex4"}, {"id": "5.5", "name": "Human review & confidence calibration", "where": "Section 5 Ex3"}, {"id": "5.6", "name": "Provenance & multi-source uncertainty", "where": "Section 6 Ex4"}]}, "sources": [{"title": "CCAR-F certification page", "url": "https://anthropic-partners.skilljar.com/claude-certified-architect-foundations-certification", "note": "exam guide, terms, policy, registration"}, {"title": "Certification FAQ", "url": "https://anthropic-partners.skilljar.com/page/faq-certifications", "note": "eligibility, scheduling, retakes, renewal"}, {"title": "Official CCAR-F prep course list", "url": "https://anthropic-partners.skilljar.com/page/claude-certified-architect-foundations-prep-courses"}, {"title": "Anthropic Academy catalog", "url": "https://anthropic.skilljar.com/"}, {"title": "Pearson VUE – Anthropic", "url": "https://www.pearsonvue.com/us/en/anthropic.html", "note": "scheduling, system test, support"}]};
const REPO = "https://github.com/william-herman/cert-study-trackers";

// ---------- Helpers ----------
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function md(s){
  const codes = [];
  let out = esc(s).replace(/`([^`]+)`/g, (_,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
  out = out.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return out.replace(/\u0000(\d+)\u0000/g, (_,i)=>"<code>"+codes[+i]+"</code>");
}
const TAG_STYLE = {added:"added", optional:"opt"};
(CERT.tag_legend||[]).forEach(l => { const st = {added:"added", optional:"opt", ex:"ex"}[l.style]; if (st && !String(l.tag).includes("–")) TAG_STYLE[l.tag] = st; });
const tagHtml = t => !t ? "" : '<span class="tag '+(TAG_STYLE[t]||"ex")+'">'+esc(t)+'</span>';
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}); } catch(e){ return ""; } };
const fmtLong = ymd => { try { const [y,m,d]=ymd.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); } catch(e){ return ymd; } };

const TIERS = {
  "field-validated": ["Field-validated", "The author has passed this certification and checked the list against that experience."],
  "source-traced":   ["Source-traced", "Built from the official sources listed below. The author has not taken this exam yet, so treat it as a structured reading of the blueprint, not a tested plan."],
  "peer-reviewed":   ["Peer-reviewed", "Built from official sources and reviewed by someone who holds the certification."]
};

const SECS = CERT.sections || [];
const OBJ = CERT.objectives && CERT.objectives.items ? CERT.objectives : null;
const DOMAINS = CERT.domains || [];
const VER = v => /^\d+(\.\d+)+$/.test(String(v)) ? "v"+v : String(v);
const DLABEL = CERT.domain_label || "Domain";
const DNAME = d => d.label || (DLABEL+" "+d.id);
const DABBR = DLABEL.split(/\s+/).map(w=>w[0]).join("").toUpperCase();
const KEY = "cst:"+CERT.slug;

// Every checkable id and which domain it counts toward
const ALL = [];
SECS.forEach(sec => sec.groups.forEach(g => g.items.forEach(it => ALL.push({id:it.id, domain:sec.domain||null, optional:it.tag==="optional"}))));
if (OBJ) OBJ.items.forEach(o => ALL.push({id:"ts-"+o.id, domain:(o.domain!=null?o.domain:(Number(String(o.id).split(".")[0])||null)), optional:false}));
const required = ALL.filter(x=>!x.optional);

// ---------- State ----------
let done = {}, filter = "all";
try { done = JSON.parse(localStorage.getItem(KEY+":done")||"{}") || {}; } catch(e){ done = {}; }
try { filter = localStorage.getItem(KEY+":filter") || "all"; } catch(e){}
function save(){
  const el = document.getElementById("save");
  try { localStorage.setItem(KEY+":done", JSON.stringify(done)); el.textContent = "Saved on this device"; el.dataset.state = "ok"; }
  catch(e){ el.textContent = "Not saved: browser storage is off"; el.dataset.state = "local"; }
}

// ---------- Static parts ----------
function renderStatic(){
  document.getElementById("hdrCode").textContent = [CERT.issuer, CERT.code, /^\d+(\.\d+)+$/.test(String(CERT.blueprint.version)) ? "v"+CERT.blueprint.version : ""].filter(Boolean).join(" · ");
  document.getElementById("hdrTitle").textContent = CERT.code+" Study Tracker";

  const t = TIERS[CERT.confidence] || [CERT.confidence, ""];
  document.getElementById("meta").innerHTML =
    '<span class="tier '+esc(CERT.confidence)+'">'+esc(t[0])+'</span>'+
    '<span>'+esc(CERT.name)+'</span><span class="sep">|</span>'+
    '<span>Traces to '+esc(CERT.blueprint.title)+' '+esc(VER(CERT.blueprint.version))+'</span><span class="sep">|</span>'+
    '<span>Last checked '+esc(fmtLong(CERT.last_checked))+'</span>';

  const age = (Date.now() - new Date(CERT.last_checked+"T00:00:00").getTime()) / 864e5;
  if (age > 180) document.getElementById("stale").innerHTML = '<div class="stale">This list was last checked against the official sources more than six months ago. Confirm the current version of the '+esc(CERT.blueprint.title)+' before relying on it, and <a href="'+issueUrl()+'" target="_blank" rel="noopener">report anything that changed</a>.</div>';

  let intro = "";
  const parts = [];
  if (CERT.snapshot) parts.push('<div><h3>'+esc(CERT.snapshot.title||"Snapshot")+'</h3><ul>'+CERT.snapshot.items.map(x=>"<li>"+md(x)+"</li>").join("")+'</ul></div>');
  if (CERT.lens) parts.push('<div class="lens"><h3>'+esc(CERT.lens.title)+'</h3>'+(CERT.lens.intro?'<p>'+md(CERT.lens.intro)+'</p>':'')+(Array.isArray(CERT.lens.body)?'<ul>'+CERT.lens.body.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>':(CERT.lens.body?'<p>'+md(CERT.lens.body)+'</p>':''))+(CERT.lens.prompts||[]).map(q=>'<q>'+esc(q)+'</q>').join("")+'</div>');
  if (parts.length) intro = '<div class="intro'+(parts.length===1?' single':'')+'">'+parts.join("")+'</div>';
  intro += '<p class="tier-note"><strong>'+esc(t[0])+':</strong> '+esc(t[1])+'</p>';
  document.getElementById("intro").innerHTML = intro;

  const legend = (CERT.tag_legend||[]).map(l=>'<span class="tag '+(TAG_STYLE[l.style]||"ex")+'">'+esc(l.tag)+'</span> '+esc(l.meaning)).join(" · ");
  document.getElementById("foot").innerHTML = '<div class="site-foot">'+
    '<p>Built from the official '+esc(CERT.blueprint.title)+' '+esc(VER(CERT.blueprint.version))+(CERT.blueprint.published?' ('+esc(CERT.blueprint.published)+')':'')+' and the sources in section B, checked '+esc(fmtLong(CERT.last_checked))+'.'+(legend?' Tags: '+legend+'.':'')+'</p>'+
    '<p>Not affiliated with or endorsed by '+esc(CERT.issuer)+'. Contains no exam questions or exam content. Where this page and the official guide disagree, the guide wins. <a href="'+issueUrl()+'" target="_blank" rel="noopener">Report outdated content</a> · <a href="../">All trackers</a> · <a href="'+REPO+'" target="_blank" rel="noopener">Source on GitHub</a></p>'+
    '<p>Content licensed <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Your ticks are stored only in this browser.</p></div>';
}
function issueUrl(){ return REPO+"/issues/new?template=outdated-content.md&title="+encodeURIComponent("["+CERT.code+"] Outdated: "); }

// ---------- Dynamic parts ----------
function itemHtml(it){
  const d = done[it.id];
  const sub = it.sub ? '<ul class="sub">'+it.sub.map(x=>"<li>"+md(x)+"</li>").join("")+"</ul>" : "";
  const ts = it.ts ? '<span class="tag ts">'+esc(it.ts)+'</span>' : "";
  return '<li class="item'+(d?' done':'')+'" data-id="'+esc(it.id)+'"><input type="checkbox" id="cb-'+esc(it.id)+'"'+(d?' checked':'')+'>'+
    '<label for="cb-'+esc(it.id)+'"><span class="t">'+ts+tagHtml(it.tag)+md(it.text)+'</span>'+sub+
    (d?'<span class="when">Done '+fmtDate(d)+'</span>':'')+'</label></li>';
}
const visible = id => filter==="all" || (filter==="done" ? !!done[id] : !done[id]);
const domainOf = id => DOMAINS.find(d=>d.id===id);
const secIds = sec => sec.groups.flatMap(g=>g.items.map(i=>i.id));

function renderSections(){
  let h = "";
  SECS.forEach(sec => {
    const ids = secIds(sec), n = ids.filter(i=>done[i]).length, dom = sec.domain ? domainOf(sec.domain) : null;
    h += '<section class="sec" id="'+esc(sec.id)+'"><div class="sec-head"><span class="no">'+esc(sec.no)+'</span><h2>'+esc(sec.title)+'</h2>'+
      (dom?'<span class="wt">'+esc(DNAME(dom))+(dom.weight!=null?' · '+dom.weight+'%':'')+'</span>':'')+'<span class="cnt">'+n+' / '+ids.length+'</span></div>';
    if (sec.note) h += '<p class="sec-note">'+md(sec.note)+'</p>';
    if (sec.callout) h += '<div class="callout">'+md(sec.callout)+'</div>';
    sec.groups.forEach(g => {
      const vis = g.items.filter(i=>visible(i.id));
      h += '<div class="group">'+(g.title?'<h4>'+esc(g.title)+'</h4>':'')+'<ul class="items">'+
        (vis.length ? vis.map(itemHtml).join("") : '<li class="hidden-note">'+(filter==="done"?"Nothing ticked here yet.":"All done in this group.")+'</li>')+'</ul></div>';
    });
    if (sec.skip) h += '<div class="skip"><h4>Skip or skim</h4><ul>'+sec.skip.map(x=>"<li>"+md(x)+"</li>").join("")+'</ul></div>';
    if (sec.out_of_scope) h += '<div class="group"><h4>Out of scope · don\'t study these</h4><ul class="oos">'+sec.out_of_scope.map(x=>"<li>"+md(x)+"</li>").join("")+'</ul></div>';
    h += '</section>';
  });

  if (OBJ){
    const cn = OBJ.items.filter(o=>done["ts-"+o.id]).length;
    h += '<section class="sec" id="cov"><div class="sec-head"><span class="no">A</span><h2>'+esc(OBJ.title||"Objective coverage")+'</h2><span class="cnt">'+cn+' / '+OBJ.items.length+'</span></div>'+
      (OBJ.note?'<p class="sec-note">'+md(OBJ.note)+'</p>':'')+'<ul class="items cov" style="border:0;background:none">';
    OBJ.items.forEach(o => {
      const id = "ts-"+o.id; if (!visible(id)) return; const d = done[id];
      h += '<li class="item'+(d?' done':'')+'" data-id="'+esc(id)+'"><input type="checkbox" id="cb-'+esc(id)+'"'+(d?' checked':'')+'><label for="cb-'+esc(id)+'"><span class="t"><span class="tag ts">'+esc(o.id)+'</span>'+md(o.name)+'</span>'+(o.where?'<span class="where">'+esc(o.where)+'</span>':'')+'</label></li>';
    });
    h += '</ul></section>';
  }

  h += '<section class="sec" id="res"><div class="sec-head"><span class="no">B</span><h2>Official sources</h2></div><ul class="res">'+
    (CERT.sources||[]).map(r=>'<li><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a>'+(r.note?' · <span style="color:var(--muted)">'+esc(r.note)+'</span>':'')+'</li>').join("")+'</ul></section>';
  document.getElementById("sections").innerHTML = h;
}

function renderMeters(){
  let h = "";
  DOMAINS.forEach((d,i) => {
    const ids = required.filter(x=>x.domain===d.id), n = ids.filter(x=>done[x.id]).length, pct = ids.length ? Math.round(n/ids.length*100) : 0;
    const sec = SECS.find(s=>s.domain===d.id);
    h += '<button type="button" class="meter'+(i===0&&DOMAINS.length%2?' d1':'')+'" data-go="'+(sec?esc(sec.id):"")+'"><span class="w'+(d.weight!=null?'':' lbl')+'">'+(d.weight!=null?d.weight+'%<small>'+esc(DABBR)+d.id+'</small>':esc(DNAME(d)))+'</span><span class="n">'+esc(d.short||d.name)+'</span>'+
      '<span class="bar"><i style="width:'+pct+'%"></i></span><span class="c">'+n+' / '+ids.length+' · '+pct+'%</span></button>';
  });
  const m = document.getElementById("meters");
  m.innerHTML = h;
  if (DOMAINS.length) m.style.setProperty("--cols", DOMAINS.length);

  const n = required.filter(x=>done[x.id]).length;
  document.getElementById("ovBar").style.width = (required.length ? n/required.length*100 : 0)+"%";
  document.getElementById("ovNum").textContent = n+" / "+required.length+" done";

  const nav = SECS.map(s=>{ const ids = secIds(s); return [s.id, s.no+" "+(s.short||s.title), ids.filter(i=>done[i]).length, ids.length]; });
  if (OBJ) nav.push(["cov","A "+(OBJ.short||"Coverage"), OBJ.items.filter(o=>done["ts-"+o.id]).length, OBJ.items.length]);
  nav.push(["res","B Sources", null, null]);
  document.getElementById("nav").innerHTML = nav.map(([id,t,a,b])=>'<a href="#'+esc(id)+'" class="'+(b&&a===b?'full':'')+'"><span>'+esc(t)+'</span>'+(b?'<span class="k">'+a+'/'+b+'</span>':'')+'</a>').join("");
}
function renderAll(){ renderSections(); renderMeters(); }

// ---------- Events ----------
document.getElementById("sections").addEventListener("change", e => {
  const cb = e.target.closest('input[type="checkbox"]'); if (!cb) return;
  const id = cb.closest(".item").dataset.id;
  if (cb.checked) done[id] = new Date().toISOString(); else delete done[id];
  const y = window.scrollY; renderAll(); window.scrollTo(0, y);
  const again = document.getElementById("cb-"+id); if (again) again.focus({preventScroll:true});
  save();
});
document.getElementById("meters").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b || !b.dataset.go) return;
  const el = document.getElementById(b.dataset.go); if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});
document.querySelectorAll(".seg button").forEach(b => {
  b.setAttribute("aria-pressed", String(b.dataset.f===filter));
  b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
    try { localStorage.setItem(KEY+":filter", filter); } catch(e){}
    renderSections();
  });
});
const resetBox = document.getElementById("resetBox");
const showReset = () => { resetBox.innerHTML = '<button type="button" class="reset" id="resetBtn">Reset progress</button>'; };
resetBox.addEventListener("click", e => {
  const t = e.target;
  if (t.id==="resetBtn"){ resetBox.innerHTML = '<div class="confirm"><span>Clear every tick?</span><button type="button" class="danger" id="resetYes">Clear all</button><button type="button" id="resetNo">Cancel</button></div>'; document.getElementById("resetNo").focus(); }
  else if (t.id==="resetYes"){ done = {}; renderAll(); save(); showReset(); }
  else if (t.id==="resetNo"){ showReset(); }
});

renderStatic();
renderAll();
</script>
