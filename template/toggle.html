<button type="button" class="theme-btn" id="themeBtn" aria-label="Switch theme" title="Switch light / dark mode">
  <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
  <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
</button>
<script>
(function(){
  var b=document.getElementById("themeBtn"), r=document.documentElement;
  function cur(){ var a=r.getAttribute("data-theme"); return a ? a : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  function paint(){ var d=cur()==="dark"; b.classList.toggle("is-dark", d); b.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); }
  b.addEventListener("click", function(){ var n=cur()==="dark"?"light":"dark"; r.setAttribute("data-theme", n); try{ localStorage.setItem("cst:theme", n); }catch(e){} paint(); });
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint); }catch(e){}
  paint();
})();
</script>
