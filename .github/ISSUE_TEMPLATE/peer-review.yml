# Generated by scripts/build.py from data/. Edit the build script, not this file.
name: Peer review a tracker
description: Hold one of these certifications? Check its tracker against your experience.
title: '[CODE] Peer review'
labels:
- peer-review
body:
- type: markdown
  attributes:
    value: 'Thanks for reviewing! Trackers are built from each certifying body''s official sources. Your review helps confirm they match what the exam actually tests.


      **Please don''t share actual exam questions or answers.** Certification exams are under NDA; describe topics and patterns instead. Reviews that include exam content will be deleted.'
- type: dropdown
  id: tracker
  attributes:
    label: Which tracker are you reviewing?
    options:
    - 'CCAO-F: Claude Certified Associate – Foundations'
    - 'CCAR-F: Claude Certified Architect – Foundations'
    - 'CCDV-F: Claude Certified Developer – Foundations'
    - 'CSM: Certified ScrumMaster'
    - 'PAL-I: Professional Agile Leadership I'
    - 'PMP: Project Management Professional'
  validations:
    required: true
- type: dropdown
  id: holds
  attributes:
    label: Do you hold this certification?
    options:
    - Yes, it's current
    - Yes, but it has lapsed
    - No, but I've taken the exam
    - 'No'
  validations:
    required: true
- type: input
  id: passed
  attributes:
    label: When did you pass it?
    description: Month and year is enough. It tells us which exam version you're comparing against.
    placeholder: e.g. March 2026
- type: dropdown
  id: accuracy
  attributes:
    label: Overall, how well does the tracker match the exam?
    options:
    - Matches well
    - Mostly matches, with a few gaps
    - Significant gaps or errors
  validations:
    required: true
- type: textarea
  id: issues
  attributes:
    label: What's wrong, outdated or missing?
    description: Point to the section or item where you can. Link an official source if something changed.
  validations:
    required: true
- type: textarea
  id: insights
  attributes:
    label: What did the exam emphasize? (optional)
    description: Patterns and topics only, e.g. which areas felt heavier than the guide suggests. These can go in the tracker's lens box.
- type: dropdown
  id: credit
  attributes:
    label: May we credit you on the tracker?
    options:
    - Yes, by name
    - Yes, by name with my LinkedIn
    - No, keep me anonymous
  validations:
    required: true
- type: input
  id: name
  attributes:
    label: Name and LinkedIn (if you'd like credit)
- type: checkboxes
  id: terms
  attributes:
    label: Confirm
    options:
    - label: My review contains no actual exam questions or answers.
      required: true
    - label: My suggestions may be published in the trackers under CC BY 4.0.
      required: true
